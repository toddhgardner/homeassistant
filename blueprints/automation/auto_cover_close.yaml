# Auto Cover Close
# Blueprint
#
# Closes a cover (garage door) automatically after it's been open for X minutes.
# If the obstruction sensor is tripped when the timer expires, the run holds
# until it clears, then re-checks the door before closing.
---

blueprint:
  name: Auto Cover Close
  description: >
    Automatically close a cover after it has been open for X minutes.
  domain: automation
  input:

    target:
      name: Cover
      description: Cover to close
      selector:
        entity:
          domain: cover
          device_class: garage

    target_lock:
      name: Lock
      description: Lock for the cover
      selector:
        entity:
          domain: lock

    target_obstruction:
      name: Obstruction
      description: Obstruction sensor for the cover
      selector:
        entity:
          domain: binary_sensor
          device_class: problem

    close_delay:
      name: Close Delay
      description: Time to wait before closing the cover
      default: 10
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: minutes
          mode: box

# restart: closing the door manually cancels the trigger timer; reopening
# starts a fresh countdown and replaces any run still waiting on an
# obstruction.
mode: restart

variables:
  obstruction: !input target_obstruction

triggers:

  # The cover itself is the only countdown. The timer starts when the cover
  # reaches "open" and is cancelled automatically if it leaves "open".
  - trigger: state
    entity_id: !input target
    to: "open"
    for:
      minutes: !input close_delay

conditions:

  - condition: state
    entity_id: !input target_lock
    state: "unlocked"

actions:

  # If something is blocking the door, hold here until it clears.
  - wait_template: "{{ is_state(obstruction, 'off') }}"

  # The door may have been closed or locked while we waited.
  - condition: state
    entity_id: !input target
    state: "open"

  - condition: state
    entity_id: !input target_lock
    state: "unlocked"

  - action: cover.close_cover
    target:
      entity_id: !input target