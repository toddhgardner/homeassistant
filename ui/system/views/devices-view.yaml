# Devices View
# System Dashboard
#
# View the status of all devices defined in packages
---
title: DEVICES
path: devices
type: sections
max_columns: 1

#
# Header
#
header:
  card:
    type: markdown
    text_only: true
    content: |-
      # Devices
  layout: center
  badges_position: top
  badges_wrap: wrap

#
# Badges
#
badges:

  - type: entity
    entity: sensor.alert_p1_active_count
    name: CRITICAL
    show_name: true
    show_state: true
    show_icon: true
    color: var(--red-color)

  - type: entity
    entity: sensor.alert_p2_active_count
    name: WARNING
    show_name: true
    show_state: true
    show_icon: true
    color: var(--orange-color)

sections:

  #
  # Devices with a Package attribute
  #
  - type: grid
    cards:
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
        filter:
          include:
            - attributes:
                package: "*"
              options:
                secondary_info: last-changed
                type: simple-entity
        sort:
          method: attribute
          attribute: package