# Test View
# System Dashboard
#
# Control test alerts for verification of system behavior
---
title: TEST
path: test
type: sections
max_columns: 1

#
# Header
#
header:
  card:
    type: markdown
    text_only: true
    content: |-
      # Alerting Tests
  layout: center
  badges_position: top
  badges_wrap: wrap

#
# Badges
#
badges:

  - type: entity
    entity: sensor.alert_p1_active_count
    name: CRITICAL
    show_name: true
    show_state: true
    show_icon: true
    color: var(--red-color)

  - type: entity
    entity: sensor.alert_p2_active_count
    name: WARNING
    show_name: true
    show_state: true
    show_icon: true
    color: var(--orange-color)

sections:
  #
  # Toggle Alerts
  #
  - type: grid
    cards:

      - type: custom:auto-entities
        show_empty: true
        filter:
          include:
            - entity_id: input_*.test_*
              options:
                secondary_info: last-changed
                icon: mdi:alert-box-outline
        card:
          type: entities
          title: Test Specific Alerts
        sort:
          method: entity_id
