# Alert View
# System Dashboard
#
# View the current status of alerts in the system
---
title: ALERTS
path: alerts
type: sections
max_columns: 2

#
# Header
#
header:
  card:
    type: markdown
    text_only: true
    content: |-
      # Alerts
  layout: center
  badges_position: top
  badges_wrap: wrap

#
# Badges
#
badges:

  - type: entity
    entity: sensor.alert_p1_active_count
    name: CRITICAL
    show_name: true
    show_state: true
    show_icon: true
    color: var(--red-color)

  - type: entity
    entity: sensor.alert_p2_active_count
    name: WARNING
    show_name: true
    show_state: true
    show_icon: true
    color: var(--orange-color)

sections:

  #
  # Active Alerts
  #
  - type: grid
    cards:
      - type: custom:auto-entities
        show_empty: true
        card:
          type: vertical-stack
          title: Active Alerts
        card_param: cards
        filter:
          include:
            - domain: alert
              not:
                state: "idle"
              options:
                type: custom:button-card
                variables:
                  alert_trigger_entity_id: |
                    [[[
                      return `${entity.entity_id.replace("alert.", "binary_sensor.")}_trigger`;
                    ]]]
                  source_entity_id: |
                    [[[
                      const trigger_entity = states[variables.alert_trigger_entity_id];
                      return trigger_entity.attributes.source_entity_id;
                    ]]]
                styles:
                  grid:
                    - grid-template-areas: '"i . ." "i n mute" "i message ." "i s ." "i l ."'
                    - grid-template-columns: 1fr 1fr 1fr
                    - grid-template-rows: 1fr 1fr 1fr 1fr 1fr
                icon: |
                  [[[
                    if (entity.entity_id.startsWith("alert.p1")) { return "mdi:alert-box-outline" }
                    if (entity.entity_id.startsWith("alert.p2")) { return "mdi:alert-outline" }
                    return "mdi:info-outline";
                  ]]]
                show_state: true
                state_display: |
                  [[[
                    return entity.state === "on" ? "Active" : "Muted";
                  ]]]
                show_label: true
                label: |
                  [[[
                    return helpers.relativeTime(states[variables.source_entity_id].last_changed);
                  ]]]
                custom_fields:
                  message: |
                    [[[
                      const trigger = states[variables.alert_trigger_entity_id];
                      return trigger?.attributes?.message;
                    ]]]
                  mute:
                    card:
                      type: custom:button-card
                      name: |
                        [[[
                          return entity.state === "on" ? "Mute" : "Unmute";
                        ]]]
                      tap_action:
                        action: call-service
                        service: |
                          [[[
                            return entity.state === "on" ? "alert.turn_off" : "alert.turn_on";
                          ]]]
                        service_data:
                          entity_id: "[[[ return entity.entity_id; ]]]"
                tap_action:
                  action: more-info
                  entity: "[[[ return variables.source_entity_id ]]]"
        sort:
          method: entity_id

  #
  # Alert History
  #
  - type: grid
    cards:
      - type: custom:auto-entities
        filter:
          include:
            - entity_id: binary_sensor.*_trigger
              options:
                hidden_state:
                  - "off"
                state_map:
                  - value: "on"
                    label: ""
                    icon: mdi:alert
                    icon_color: red
                attributes:
                  - value: message
                    name: Alert
                  - value: devices
                    name: Devices
        card:
          type: custom:multiple-logbook-card
          title: Latest Alerts
          no_event: No recent alerts
          history: 7
          group_by_day: true
          date_format: relative