################################################################################
# Alerting UI
# Test View
#
# Control test alerts for verification of system behavior
################################################################################
---
title: TEST
path: test
type: sections
max_columns: 1

################################################################################
header:
  card:
    type: markdown
    text_only: true
    content: |-
      # Alerting Tests
  layout: center
  badges_position: top
  badges_wrap: wrap

sections:
  ##############################################################################
  # Left Section - Test Alert Toggles
  ##############################################################################
  - type: grid
    cards:
      - type: entities
        title: Test Alerts
        show_header_toggle: false
        entities:
          - entity: input_boolean.test_alert_p1_trigger
            name: P1 Critical Alert Test
            secondary_info: last-changed
            icon: mdi:alert-box-outline

          - entity: input_boolean.test_alert_p2_trigger
            name: P2 Warning Alert Test
            secondary_info: last-changed
            icon: mdi:alert-outline

          - entity: input_boolean.test_alert_p3_trigger
            name: P3 Info Alert Test
            secondary_info: last-changed
            icon: mdi:information-outline

      - type: entities
        title: Test Actions
        show_header_toggle: false
        entities:
          - type: button
            name: Turn Off All Test Alerts
            icon: mdi:power
            tap_action:
              action: call-service
              service: input_boolean.turn_off
              service_data:
                entity_id:
                  - input_boolean.test_alert_p1_trigger
                  - input_boolean.test_alert_p2_trigger
                  - input_boolean.test_alert_p3_trigger
