################################################################################
# Alerting UI
# Test View
#
# Control test alerts for verification of system behavior
################################################################################
---
title: TEST
path: test
type: sections
max_columns: 1

################################################################################
header:
  card:
    type: markdown
    text_only: true
    content: |-
      # Alerting Tests
  layout: center
  badges_position: top
  badges_wrap: wrap

################################################################################
# Badges
################################################################################
badges:
  - type: entity
    entity: sensor.alert_p1_active_count
    name: CRITICAL
    show_name: true
    show_state: true
    show_icon: true
    color: var(--red-color)

  ##############################################################################
  - type: entity
    entity: sensor.alert_p2_active_count
    name: WARNING
    show_name: true
    show_state: true
    show_icon: true
    color: var(--orange-color)

  ##############################################################################
  # - type: entity
  #   entity: sensor.alert_p3_active_count
  #   name: INFO
  #   show_name: true
  #   show_state: true
  #   show_icon: true
  #   color: var(--blue-color)

sections:
  ##############################################################################
  # Left Section - Test Alert Toggles
  ##############################################################################
  - type: grid
    cards:
      - type: entities
        title: Test Alerts
        show_header_toggle: false
        entities:
          - entity: input_boolean.p1_test_alert
            name: P1 Critical Alert Test
            secondary_info: last-changed
            icon: mdi:alert-box-outline

          - entity: input_boolean.p2_test_alert
            name: P2 Warning Alert Test
            secondary_info: last-changed
            icon: mdi:alert-outline

          # - entity: input_boolean.test_alert_p3_trigger
          #   name: P3 Info Alert Test
          #   secondary_info: last-changed
          #   icon: mdi:information-outline
