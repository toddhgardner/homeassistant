################################################################################
# Alerting UI
# Status View
#
# View the current status of alerts in the system
################################################################################
---
title: STATUS
path: status
type: sections
max_columns: 1

################################################################################
header:
  card:
    type: markdown
    text_only: true
    content: |-
      # Alerting Status
  layout: center
  badges_position: top
  badges_wrap: wrap

################################################################################
# Badges
################################################################################
badges:
  - type: entity
    entity: sensor.alert_p1_active_count
    name: CRITICAL
    show_name: true
    show_state: true
    show_icon: true
    color: var(--red-color)

  ##############################################################################
  - type: entity
    entity: sensor.alert_p2_active_count
    name: WARNING
    show_name: true
    show_state: true
    show_icon: true
    color: var(--orange-color)

  ##############################################################################
  # - type: entity
  #   entity: sensor.alert_p3_active_count
  #   name: INFO
  #   show_name: true
  #   show_state: true
  #   show_icon: true
  #   color: var(--blue-color)

sections:
  ################################################################################
  # Section 1 TODO
  ################################################################################
  - type: grid
    cards:
      - type: custom:auto-entities
        show_empty: false
        card:
          type: vertical-stack
          title: Active Alerts
        card_param: cards
        filter:
          include:
            - domain: alert
              not:
                state: "idle"
              options:
                type: custom:button-card
                variables:
                  entity_id: "[[[ return entity.entity_id; ]]]"
                styles:
                  grid:
                    - grid-template-areas: '"i . ." "i n ack" "i s ." "i l snooze" "i . ."'
                    - grid-template-columns: 1fr 1fr 1fr
                    - grid-template-rows: 1fr 1fr 1fr 1fr 1fr
                show_state: true
                state_display: |
                  [[[
                    return entity.state === "on" ? "Active" : "Acknowledged";
                  ]]]
                show_label: true
                label: |
                  [[[
                    const alertId = entity.entity_id.split('.')[1];
                    const triggerSensorId = `binary_sensor.${alertId}_trigger`;
                    const triggerSensor = states[triggerSensorId];
                    console.log(triggerSensor);
                    const triggerStatus = triggerSensor ? triggerSensor.state : 'unknown';
                    return `Trigger: ${triggerStatus}`;
                  ]]]
                custom_fields:
                  ack:
                    card:
                      type: custom:button-card
                      name: "Acknowledge"
                      tap_action:
                        action: call-service
                        service: "[[[ return entity.attributes.is_acked ? 'alert2.unack' : 'alert2.ack'; ]]]"
                        service_data:
                          entity_id: "[[[ return entity.entity_id; ]]]"
                  snooze:
                    card:
                      type: custom:button-card
                      name: "Snooze"
                      tap_action:
                        action: call-service
                        service: alert2.notification_control
                        service_data:
                          entity_id: "[[[ return entity.entity_id; ]]]"
                          ack_at_snooze_start: false
                          enable: true
                          snooze_until: |
                            [[[
                              if (entity.attributes.notification_control  === 'enabled') {
                                const snoozeMinutes = parseInt(states['input_number.alert_snooze_duration'].state, 10);
                                const until = new Date();
                                until.setTime(until.getTime() + (snoozeMinutes*60*1000));
                                return until.toISOString();
                              }
                              else {
                                return undefined;
                              }
                            ]]]

                # fuck around with this later once it works.
                # styles:
                #   card:
                # - background-color: |
                #     [[[
                #       if (entity.attributes.priority === 'high') return 'rgba(255, 0, 0, 0.2)';
                #       if (entity.attributes.priority === 'medium') return 'rgba(255, 152, 0, 0.2)';
                #       return 'rgba(33, 150, 243, 0.2)';
                #     ]]]
                # - border: |
                #     [[[
                #       if (entity.attributes.priority === 'high') return '2px solid red';
                #       if (entity.attributes.priority === 'medium') return '2px solid orange';
                #       return '2px solid #2196f3';
                #     ]]]
                # icon:
                #   - color: white
                tap_action:
                  action: call-service
                  service: alert2.ack
                  service_data:
                    entity_id: "[[[ return entity.entity_id; ]]]"
                hold_action:
                  action: more-info
        sort:
          method: entity_id
