################################################################################
# Alerting UI
# Status View
#
# View the current status of alerts in the system
################################################################################
---
title: STATUS
path: status
type: sections
max_columns: 1

################################################################################
header:
  card:
    type: markdown
    text_only: true
    content: |-
      # Alerting Status
  layout: center
  badges_position: top
  badges_wrap: wrap

################################################################################
# Badges
################################################################################
badges:
  - type: entity
    entity: sensor.alert_p1_active_count
    name: CRITICAL
    show_name: true
    show_state: true
    show_icon: true
    color: var(--red-color)

  ##############################################################################
  - type: entity
    entity: sensor.alert_p2_active_count
    name: WARNING
    show_name: true
    show_state: true
    show_icon: true
    color: var(--orange-color)

  ##############################################################################
  # - type: entity
  #   entity: sensor.alert_p3_active_count
  #   name: INFO
  #   show_name: true
  #   show_state: true
  #   show_icon: true
  #   color: var(--blue-color)

sections:
  ################################################################################
  # Section 1 TODO
  ################################################################################
  - type: grid
    cards:
      - type: custom:auto-entities
        show_empty: false
        card:
          type: vertical-stack
          title: Active Alerts
        card_param: cards
        filter:
          include:
            - domain: alert
              not:
                state: "idle"
              options:
                type: custom:button-card
                variables:
                  source_entity_id: |
                    [[[
                      const trigger_entity = states[`${entity.entity_id.replace("alert.", "binary_sensor.")}_trigger`];
                      return trigger_entity.attributes.source_entity_id;
                    ]]]
                styles:
                  grid:
                    - grid-template-areas: '"i . ." "i n mute" "i s ." "i l snooze" "i . ."'
                    - grid-template-columns: 1fr 1fr 1fr
                    - grid-template-rows: 1fr 1fr 1fr 1fr 1fr
                show_state: true
                state_display: |
                  [[[
                    return entity.state === "on" ? "Active" : "Muted";
                  ]]]
                show_label: true
                label: |
                  [[[
                    return helpers.relativeTime(states[variables.source_entity_id].last_changed);
                  ]]]
                custom_fields:
                  mute:
                    card:
                      type: custom:button-card
                      name: |
                        [[[
                          return entity.state === "on" ? "Mute" : "Unmute";
                        ]]]
                      tap_action:
                        action: call-service
                        service: |
                          [[[
                            return entity.state === "on" ? "alert.turn_off" : "alert.turn_on";
                          ]]]
                        service_data:
                          entity_id: "[[[ return entity.entity_id; ]]]"
                tap_action:
                  action: more-info
                  entity: "[[[ return variables.source_entity_id ]]]"
        sort:
          method: entity_id
