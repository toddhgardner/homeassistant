# Power Monitoring
# General
#
# Monitor UPS status and alert when on battery power
---
#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: general/power_monitoring

    #
    # Programmatic entities defined in this package
    #
    alert.p2_ups_on_battery:
      <<: *package

    automation.ups_emergency_shutdown:
      <<: *package

    binary_sensor.p2_ups_on_battery_trigger:
      <<: *package

    #
    # Sensors needed to function
    #
    sensor.cyberpower_network_ups_battery_charge:
      device_monitoring: true
      friendly_name: UPS Battery

    sensor.cyberpower_network_ups_status:
      device_monitoring: true
      friendly_name: UPS Status

#
# Automations
#
automation:
  - id: ups_emergency_shutdown
    alias: UPS Emergency Shutdown
    description: "Shutdown HA and NAS when UPS battery drops below 20%"
    triggers:
      - trigger: state
        entity_id: sensor.cyberpower_network_ups_battery_charge
      - trigger: state
        entity_id: sensor.cyberpower_network_ups_status
    conditions:
      - condition: template
        value_template: >
          {{ 'On Battery' in states('sensor.cyberpower_network_ups_status')
             and states('sensor.cyberpower_network_ups_battery_charge') | float(100) < 95 }}
    actions:
      - action: notify.p1_critical
        data:
          title: "🪫 UPS battery critical - shutting down"
          message: "Battery at {{ states('sensor.cyberpower_network_ups_battery_charge', rounded=True, with_unit=True) }} - Initiating emergency shutdown"
          data:
            tag: p1_ups_critical
            subtitle: Lavender Circle
            group: ha
            push:
              interruption-level: critical
            url: "/1-system/alerts"
      - delay:
          seconds: 10
      - action: synology_dsm.shutdown
      - delay:
          seconds: 10
      - action: hassio.host_shutdown
    mode: single

#
# Alert Triggers
#
template:
  - binary_sensor:
      - name: p2_ups_on_battery_trigger
        state: >
          {{ 'On Battery' in states('sensor.cyberpower_network_ups_status') }}
        attributes:
          source_entity_id: sensor.cyberpower_network_ups_status
          title: 🔌 Power is out
          message: >
            {% if 'On Battery' in states('sensor.cyberpower_network_ups_status') %}
              UPS is running on battery power ({{ states('sensor.cyberpower_network_ups_battery_charge', rounded=True, with_unit=True) }})
            {%- else -%}
              UPS is operating normally ({{ states('sensor.cyberpower_network_ups_battery_charge', rounded=True, with_unit=True) }})
            {%- endif -%}

#
# Alerts
#
alert:
  p2_ups_on_battery:
    name: UPS On Battery Warning
    entity_id: binary_sensor.p2_ups_on_battery_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p2_warning
    repeat:
      - 120
      - 240
    title: "{{ state_attr('binary_sensor.p2_ups_on_battery_trigger', 'title') }}"
    message: "{{ state_attr('binary_sensor.p2_ups_on_battery_trigger', 'message') }}"
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p2_ups_on_battery_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_ups_on_battery
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      actions:
        - action: alert.p2_ups_on_battery.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"
