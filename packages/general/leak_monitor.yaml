# Leak Monitor
# General
#
# Trigger alerts if any leak sensor goes off.
---
#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: general/leak_monitor

    #
    # Programmatic entities defined in this package
    #
    alert.p1_leak_detector:
      <<: *package
    binary_sensor.p1_leak_monitor_trigger:
      <<: *package

template:
  - binary_sensor:

      #
      # Leak Alert Trigger
      #
      - name: p1_leak_monitor_trigger
        state: "{{ this.attributes.get('entities', []) | count > 0 }}"
        availability: >
          {% from 'labeled_all_entities.jinja' import labeled_all_entities %}
          {% set all_entities = labeled_all_entities('Leak', as_array) %}
          {{ states
            | selectattr('entity_id', 'in', all_entities)
            | selectattr('attributes.device_class', 'eq', 'moisture')
            | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
            | list | count > 0 }}
        attributes:
          device_class: problem
          entities: >
            {% set labeled_entities = label_entities('Leak') | list %}
            {{ states.binary_sensor
              | selectattr('entity_id', 'in', labeled_entities)
              | selectattr('attributes.device_class', 'eq', 'moisture')
              | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
              | selectattr('state', 'eq', 'on')
              | map(attribute="entity_id", default="Unknown")
              | list }}
          message: >
            {% set entities = this.attributes.get('entities', []) %}
            {% set entity_count = entities | count %}
            {% set entity_first = entities | first | default('') %}
            {% if entity_count == 0 %}All sensors dry
            {% elif entity_count == 1 %}{{ state_attr(entity_first, 'friendly_name') }} is {{ states(entity_first, rounded=True, with_unit=True) }}
            {% else %}{{ state_attr(entity_first, 'friendly_name') }} ({{ states(entity_first, rounded=True, with_unit=True) }}) and {{ entity_count - 1 }} others are wet
            {% endif %}
          source_entity_id: "{{ this.entity_id }}"
          title: 💧 Leak Detected

#
# Alerts
#
alert:

  p1_leak_monitor:
    name: Leak Monitor Alarm
    entity_id: binary_sensor.p1_leak_monitor_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p1_critical
    repeat: 30
    title: "{{ state_attr('binary_sensor.p1_leak_monitor_trigger', 'title') }}"
    message: "{{ state_attr('binary_sensor.p1_leak_monitor_trigger', 'message') }}"
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p1_leak_monitor_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p1_leak_monitor
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      push:
        interruption-level: critical
      actions:
        - action: alert.p1_leak_monitor.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"
