# Theater
# Area
---
#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      theater_media_player: &theater_media_player media_player.home_theater
      theater_lights_main: &theater_lights_main light.theater_main_lights
      theater_lights_decor: &theater_lights_decor light.theater_sconces
      pkg: &package
        package: area/theater

    *theater_media_player :
      <<: *package
      friendly_name: Theater AppleTV

    *theater_lights_main :
      <<: *package
      friendly_name: Theater Lights

    *theater_lights_decor :
      <<: *package
      friendly_name: Theater Decor Lighting

#
# Scenes
#
scene:

  - id: theater_lights_paused
    name: Theater Lights Paused
    icon: mdi:pause-circle
    entities:
      *theater_lights_main :
        state: "on"
        brightness: 25
      *theater_lights_decor :
        state: "on"
        brightness: 255

  - id: theater_lights_playing
    name: Theater Lights Playing
    icon: mdi:play-circle
    entities:
      *theater_lights_main :
        state: "off"
      *theater_lights_decor :
        state: "on"
        brightness: 64

  - id: theater_lights_full
    name: Theater Lights Full
    icon: mdi:lightbulb-on
    entities:
      *theater_lights_main :
        state: "on"
        brightness: 255
      *theater_lights_decor :
        state: "off"

#
# Automations
#
automation:

  - id: theater_auto_pause_lights
    alias: Theater Auto Pause Lights
    description: "Set theater-lights-paused scene when Apple TV is paused or idle"
    triggers:
      - trigger: state
        entity_id: *theater_media_player
        to: "paused"
        for:
          seconds: 2
      - trigger: state
        entity_id: *theater_media_player
        to: "idle"
        for:
          seconds: 2
    conditions: []
    actions:
      - action: scene.turn_on
        target:
          entity_id: scene.theater_lights_paused
        data:
          transition: 2
    mode: restart

  - id: theater_auto_playing_lights
    alias: Theater Auto Playing Lights
    description: "Set theater-lights-playing scene when Apple TV starts playing content"
    triggers:
      - trigger: state
        entity_id: *theater_media_player
        to: "playing"
        for:
          seconds: 10
    actions:
      - action: scene.turn_on
        target:
          entity_id: scene.theater_lights_playing
        data:
          transition: 2
    mode: restart

  - id: theater_auto_off_lights
    alias: Theater Auto Off Lights
    description: "Set theater-lights-full scene when Apple TV turns off"
    triggers:
      - trigger: state
        entity_id: *theater_media_player
        to: "standby"
        not_from: "unknown" # so lights dont come on when it disconnects or reboots
      - trigger: state
        entity_id: *theater_media_player
        to: "off"
        not_from: "unknown" # so lights dont come on when it disconnects or reboots
    conditions: []
    actions:
      - action: scene.turn_on
        target:
          entity_id: scene.theater_lights_full
        data:
          transition: 2
    mode: restart
