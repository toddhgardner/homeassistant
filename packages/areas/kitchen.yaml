# Kitchen
# Area
---
#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      kitchen_pantry_door: &kitchen_pantry_door binary_sensor.kitchen_pantry_door
      kitchen_pantry_lights: &kitchen_pantry_lights switch.kitchen_pantry_light_switch
      pkg: &package
        package: area/kitchen

    *kitchen_pantry_door :
      <<: *package
      friendly_name: Kitchen Pantry Door

    *kitchen_pantry_lights :
      <<: *package
      friendly_name: Kitchen Pantry Lights

#
# Automations
#
automation:

  - id: kitchen_pantry_auto_lights
    alias: Kitchen Pantry Auto Lights
    description: >
      Turn on pantry lights when door opens, turn off 2 minutes after door
      closes.
    triggers:
      - trigger: state
        entity_id: *kitchen_pantry_door
        to: "on"
        id: door_opened
      - trigger: state
        entity_id: *kitchen_pantry_door
        to: "off"
        for:
          minutes: 2
        id: door_closed
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: door_opened
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: *kitchen_pantry_lights
          - conditions:
              - condition: trigger
                id: door_closed
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: *kitchen_pantry_lights
    mode: restart

  - id: kitchen_pantry_lights_auto_off
    alias: Kitchen Pantry Lights Auto Off
    description: "Turn off idle pantry lights."
    triggers:
      - trigger: state
        entity_id: *kitchen_pantry_lights
        to: "on"
        for:
          minutes: 10
    actions:
      - action: switch.turn_off
        target:
          entity_id: *kitchen_pantry_lights
    mode: restart
