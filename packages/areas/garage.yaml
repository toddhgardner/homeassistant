# Garage
# Area
---
#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      garage_door_double: &garage_door_double cover.konnected_f0f5bd514400_garage_door
      garage_door_double_lock: &garage_door_double_lock lock.konnected_f0f5bd514400_lock
      garage_lights_inside: &garage_lights_inside switch.garage_lights
      garage_lights_outside: &garage_lights_outside switch.outside_garage_lights
      garage_freezer_temp: &garage_freezer_temp sensor.garage_freezer_monitor_temperature
      pkg: &package
        package: area/garage
    *garage_door_double :
      <<: *package
      friendly_name: Garage Double Door
    *garage_door_double_lock :
      <<: *package
      friendly_name: Garage Double Door Lock
    *garage_lights_inside :
      <<: *package
      friendly_name: Garage Inside Lights
    *garage_lights_outside :
      <<: *package
      friendly_name: Garage Outside Lights
    *garage_freezer_temp :
      <<: *package
      friendly_name: Garage Freezer Temperature

#
# Automations
#
automation:
  - id: garage_double_auto_close
    alias: Garage Double Auto Close
    description: "Close double garage door if left open for 10 minutes."
    triggers:
      - trigger: state
        entity_id: *garage_door_double
        to: "open"
        for:
          hours: 0
          minutes: 10
          seconds: 0
    conditions:
      - condition: state
        entity_id: *garage_door_double_lock
        state: "unlocked"
    actions:
      - action: cover.close_cover
        target:
          entity_id: *garage_door_double
    mode: restart

  - id: garage_double_auto_lights
    alias: Garage Double Auto Lights
    description: "Turn on garage lights when double garage door is open."
    triggers:
      - trigger: state
        entity_id: *garage_door_double
        to: "opening"
        id: double_garage_door_opening
      - trigger: state
        entity_id: *garage_door_double
        to: "closed"
        id: double_garage_door_closed
    actions:
      - choose:
          # When door is opening - save current state and turn on lights
          - conditions:
              - condition: trigger
                id: double_garage_door_opening
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('scene.garage_lights_previous_state') == 'unknown' }}"
                then:
                  - action: scene.create
                    data:
                      snapshot_entities:
                        - *garage_lights_inside
                        - *garage_lights_outside
                      scene_id: garage_lights_previous_state
              - action: switch.turn_on
                target:
                  entity_id:
                    - *garage_lights_inside
                    - *garage_lights_outside

          # When door is closed - wait 5 minutes then restore previous state
          - conditions:
              - condition: trigger
                id: double_garage_door_closed
            sequence:
              - delay:
                  minutes: 5
              - action: scene.turn_on
                target:
                  entity_id: scene.garage_lights_previous_state
              - action: scene.delete
                target:
                  entity_id: scene.garage_lights_previous_state
    mode: restart

#
# Alert Triggers
#
template:

  - binary_sensor:
      - name: p2_garage_double_open_trigger
        state: >
          {{ is_state("*garage_door_double", 'open') }}
        availability: >
          {{ not is_state("*garage_door_double", ['unavailable', 'unknown', 'none']) }}
        delay_on:
          minutes: 60
        attributes:
          source_entity_id: *garage_door_double

  - binary_sensor:
      - name: p1_garage_freezer_temp_trigger
        state: >
          {{ states("*garage_freezer_temp") | int(0) < -10
            or states("*garage_freezer_temp") | int(0) > 10 }}
        availability: >
          {{ not is_state("*garage_freezer_temp", ['unavailable', 'unknown', 'none']) }}
        delay_on:
          minutes: 30
        attributes:
          source_entity_id: *garage_freezer_temp

#
# Alerts
#
alert:

  p2_garage_double_open:
    name: Garage Double Door Open
    entity_id: binary_sensor.p2_garage_double_open_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p2_warning
    repeat:
      - 60
      - 120
    title: ⚠️ Garage Double Door Open
    message: >
      ACTIVE: {{ states(state_attr('binary_sensor.p2_garage_double_open_trigger', 'source_entity_id'), rounded=True, with_unit=True) }} for {{ relative_time(states.binary_sensor.p2_garage_double_open_trigger.last_changed) }}
    done_message: >
      DONE: {{ states(state_attr('binary_sensor.p2_garage_double_open_trigger', 'source_entity_id'), rounded=True, with_unit=True) }} on {{ states.binary_sensor.p2_garage_double_open_trigger.last_changed.strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_garage_double_open
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      actions:
        - action: alert.p2_garage_double_open.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"

  p1_garage_freezer_temp:
    name: Garage Freezer Temp
    entity_id: binary_sensor.p1_garage_freezer_temp_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p1_critical
    repeat:
      - 30
      - 60
    title: 🚨 Garage Freezer Temp
    message: >
      ACTIVE: {{ states(state_attr('binary_sensor.p1_garage_freezer_temp_trigger', 'source_entity_id'), rounded=True, with_unit=True) }} for {{ relative_time(states.binary_sensor.p1_garage_freezer_temp_trigger.last_changed) }}
    done_message: >
      DONE: {{ states(state_attr('binary_sensor.p1_garage_freezer_temp_trigger', 'source_entity_id'), rounded=True, with_unit=True) }} on {{ states.binary_sensor.p1_garage_freezer_temp_trigger.last_changed.strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p1_garage_freezer_temp
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      push:
        interruption-level: critical
      actions:
        - action: alert.p1_garage_freezer_temp.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"