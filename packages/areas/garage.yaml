# Garage
# Area
---
#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: area/garage

    #
    # Programmatic entities defined in this package
    #
    alert.p1_garage_freezer_temp:
      <<: *package
    alert.p2_garage_double_open:
      <<: *package
    automation.garage_double_auto_close:
      <<: *package
    automation.garage_auto_lights:
      <<: *package
    binary_sensor.p1_garage_freezer_temp_trigger:
      <<: *package
    binary_sensor.p2_garage_double_open_trigger:
      <<: *package

    #
    # Sensors needed to function
    #
    binary_sensor.alarm_panel_garage_door:
      device_monitoring: true
      friendly_name: Garage Door

    cover.garage_double_garage_door:
      device_monitoring: true
      friendly_name: Garage Double Cover

    lock.garage_double_lock:
      device_monitoring: true
      friendly_name: Garage Double Cover Lock

    switch.garage_lights:
      device_monitoring: true
      friendly_name: Garage Light Switch

    switch.outside_garage_lights:
      device_monitoring: true
      friendly_name: Garage Outside Lights

    sensor.garage_freezer_monitor_temperature:
      device_monitoring: true
      friendly_name: Garage Freezer Temperature

#
# Automations
#
automation:
  - id: garage_double_auto_close
    alias: Garage Double Auto Close
    description: "Close double garage door if left open for 10 minutes."
    triggers:
      - trigger: state
        entity_id: cover.garage_double_garage_door
        to: "open"
        for:
          minutes: 10
    conditions:
      - condition: state
        entity_id: lock.garage_double_lock
        state: "unlocked"
    actions:
      - action: cover.close_cover
        target:
          entity_id: cover.garage_double_garage_door
    mode: restart

  - id: garage_auto_lights
    alias: Garage Auto Lights
    use_blueprint:
      path: auto_door_lights.yaml
      input:
        trigger_sensors:
          - binary_sensor.alarm_panel_garage_door
          - cover.garage_double_garage_door
        target_lights: switch.garage_lights
        off_delay: 2
        off_idle_delay: 10


#
# Alert Triggers
#
template:

  - binary_sensor:
      - name: p2_garage_double_open_trigger
        state: >
          {{ is_state("cover.garage_double_garage_door", 'open') }}
        availability: >
          {{ not is_state("cover.garage_double_garage_door", ['unavailable', 'unknown', 'none']) }}
        delay_on:
          minutes: 60
        attributes:
          source_entity_id: cover.garage_double_garage_door
          title: 🚗 Garage Door Open
          message: >
            Open since {{ as_local(states.cover.garage_double_garage_door.last_changed).strftime('%a %b %-d, %-I:%M %p') }}

  - binary_sensor:
      - name: p1_garage_freezer_temp_trigger
        state: >
          {{ states("sensor.garage_freezer_monitor_temperature") | int(0) < -10
            or states("sensor.garage_freezer_monitor_temperature") | int(0) > 10 }}
        availability: >
          {{ not is_state("sensor.garage_freezer_monitor_temperature", ['unavailable', 'unknown', 'none']) }}
        delay_on:
          minutes: 30
        attributes:
          source_entity_id: sensor.garage_freezer_monitor_temperature
          title: ❄️ Garage Freezer Temp
          message: >
            Freezer temp at {{ states('sensor.garage_freezer_monitor_temperature', rounded=True, with_unit=True) }}

#
# Alerts
#
alert:

  p2_garage_double_open:
    name: Garage Double Door Open
    entity_id: binary_sensor.p2_garage_double_open_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p2_warning
    repeat:
      - 60
      - 120
    title: "{{ state_attr('binary_sensor.p2_garage_double_open_trigger', 'title') }}"
    message: "{{ state_attr('binary_sensor.p2_garage_double_open_trigger', 'message') }}"
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p2_garage_double_open_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_garage_double_open
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      actions:
        - action: alert.p2_garage_double_open.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"

  p1_garage_freezer_temp:
    name: Garage Freezer Temp
    entity_id: binary_sensor.p1_garage_freezer_temp_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p1_critical
    repeat:
      - 30
      - 60
    title: "{{ state_attr('binary_sensor.p1_garage_freezer_temp_trigger', 'title') }}"
    message: "{{ state_attr('binary_sensor.p1_garage_freezer_temp_trigger', 'message') }}"
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p1_garage_freezer_temp_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p1_garage_freezer_temp
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      push:
        interruption-level: critical
      actions:
        - action: alert.p1_garage_freezer_temp.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"