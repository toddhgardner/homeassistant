# System Usage Alert
# Alerts
#
---

homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts/p3_system_usage_alert

    alert.p3_system_usage:
      <<: *package
    binary_sensor.p3_system_usage_trigger:
      <<: *package

template:
  - binary_sensor:
      - name: P3 System Usage Trigger
        unique_id: p3_system_usage_trigger
        variables:
          label: System Usage
        state: >
          {{ this.attributes.get('active_entities', []) | count > 0 }}
        delay_on:
          minutes: 1
        availability: >
          {% set labeled_entities = label_entities(label) %}
          {{ states.binary_sensor
            | selectattr('entity_id', 'in', labeled_entities)
            | selectattr('attributes.device_class', 'eq', 'problem')
            | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
            | map(attribute='entity_id')
            | list | count > 0 }}
        attributes:
          device_class: problem
          monitored_entities: >
            {{ label_entities(label) }}
          active_entities: >
            {% set labeled_entities = label_entities(label) | list %}
            {{ states.binary_sensor
              | selectattr('entity_id', 'in', labeled_entities)
              | selectattr('attributes.device_class', 'eq', 'problem')
              | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
              | selectattr('state', 'eq', 'on')
              | map(attribute='entity_id')
              | list }}
          title: 🖥️ System usage problem
          message: >
            {% set active_entities = this.attributes.get('active_entities', []) %}
            {% if active_entities | count == 0 %}
              All systems are okay.
            {% else %}
              {% set ns = namespace(parts=[]) %}
              {% for e in active_entities %}
                {% set src = state_attr(e, 'entity_id') | default(e, true) %}
                {% set ns.parts = ns.parts + [state_attr(src, 'friendly_name')
                  ~ ' usage is high at ' ~ states(src, rounded=True, with_unit=True)] %}
              {% endfor %}
              {{ ns.parts | join(', ') }}.
            {% endif %}
          # Retained so the recovery can say what cleared — same pattern
          # as p1_leak_alert.yaml (this.attributes reads the previous render).
          last_over_limit: >
            {% set active = this.attributes.get('active_entities', []) %}
            {% if active | count > 0 %}
              {% set ns = namespace(names=[]) %}
              {% for e in active %}
                {% set src = state_attr(e, 'entity_id') | default(e, true) %}
                {% set ns.names = ns.names + [state_attr(src, 'friendly_name')] %}
              {% endfor %}
              {{ ns.names }}
            {% else %}
              {{ this.attributes.get('last_over_limit', []) }}
            {% endif %}
          recovery_message: >
            {% set last = this.attributes.get('last_over_limit', []) %}
            {% if last | count > 0 %}
              {{ last | join(', ') }} back under limits.
            {% else %}
              Systems back under limits.
            {% endif %}
          source_entity_id: >
            {% set active_entities = this.attributes.get('active_entities', []) %}
            {% if active_entities | count > 0 %}
              {% set entity_first = active_entities | first %}
              {% set entity_source = state_attr(entity_first, 'entity_id') | default(entity_first, true) %}
              {{ entity_source }}
            {% else %}
              {{ this.entity_id }}
            {% endif %}

alert:
  p3_system_usage:
    name: System Usage
    entity_id: binary_sensor.p3_system_usage_trigger
    state: 'on'
    can_acknowledge: true
    skip_first: false
    notifiers: persistent_notification
    repeat:
      - 1440
    title: >
      {{ state_attr('binary_sensor.p3_system_usage_trigger', 'title') }}
    message: >
      {{ state_attr('binary_sensor.p3_system_usage_trigger', 'message') }}
    done_message: >
      {{ state_attr('binary_sensor.p3_system_usage_trigger', 'recovery_message') }}
      Recovered at {{ as_local(states.binary_sensor.p3_system_usage_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p3_system_usage
      group: ha
      url: /dashboard-lavender/alerts
      actions:
        - action: alert.p3_system_usage.mute
          title: 'Mute'
          icon: 'sfsymbols:bell.slash'