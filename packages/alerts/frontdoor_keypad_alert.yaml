# Frontdoor Keypad Alert
# Alerts
#
---

homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts/frontdoor_keypad_alert

    alert.p1_frontdoor_keypad:
      <<: *package

alert:
  p1_frontdoor_keypad:
    name: Frontdoor Keypad Disabled
    entity_id: binary_sensor.front_door_keypad_disabled
    state: 'on'
    can_acknowledge: true
    skip_first: false
    notifiers: p1_alert
    repeat: 30
    title: 🔒 Frontdoor Keypad Disabled
    message: Keypad was disabled after repeated attempts
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.front_door_keypad_disabled.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p1_frontdoor_keypad
      group: ha
      url: /dashboard-lavender/alerts
      push:
        interruption-level: critical
      actions:
        - action: alert.p1_frontdoor_keypad.mute
          title: Mute
          icon: sfsymbols:bell.slash
