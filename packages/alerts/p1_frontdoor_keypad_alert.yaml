# Frontdoor Keypad Alert
# Alerts
#
---

homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts/p1_frontdoor_keypad_alert

    alert.p1_frontdoor_keypad:
      <<: *package
    binary_sensor.p1_frontdoor_keypad_trigger:
      <<: *package

template:
  - binary_sensor:
      - name: P1 Frontdoor Keypad Trigger
        unique_id: p1_frontdoor_keypad_trigger
        variables:
          source: binary_sensor.front_door_keypad_disabled
        state: >
          {{ is_state(source, 'on') }}
        availability: >
          {{ not is_state(source, ['unknown', 'unavailable', 'none']) }}
        attributes:
          device_class: problem
          title: 🔒 Frontdoor Keypad Disabled
          message: Keypad was disabled after repeated attempts
          source_entity_id: >
            {{ source }}

alert:
  p1_frontdoor_keypad:
    name: Frontdoor Keypad Disabled
    entity_id: binary_sensor.p1_frontdoor_keypad_trigger
    state: 'on'
    can_acknowledge: true
    skip_first: false
    notifiers: p1_alert
    repeat: 30
    title: >
      {{ state_attr('binary_sensor.p1_frontdoor_keypad_trigger', 'title') }}
    message: >
      {{ state_attr('binary_sensor.p1_frontdoor_keypad_trigger', 'message') }}
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p1_frontdoor_keypad_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p1_frontdoor_keypad
      group: ha
      url: /dashboard-lavender/alerts
      push:
        interruption-level: critical
      actions:
        - action: alert.p1_frontdoor_keypad.mute
          title: Mute
          icon: sfsymbols:bell.slash