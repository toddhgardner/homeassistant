# Leak Alert
# Alerts
#
---

homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts/p1_leak_alert

    alert.p1_leak:
      <<: *package
    binary_sensor.p1_leak_trigger:
      <<: *package

template:
  - binary_sensor:
      - name: P1 Leak Trigger
        unique_id: p1_leak_trigger
        variables:
          group_entity_id: binary_sensor.leak_sensors
        state: >
          {{ is_state(group_entity_id, 'on') }}
        delay_on:
          seconds: 10
        availability: >
          {{ states(group_entity_id) is defined and
            not is_state(group_entity_id, ['unknown', 'unavailable', 'none']) }}
        attributes:
          device_class: problem
          monitored_entities: >
            {{ expand(group_entity_id)
              | map(attribute='entity_id')
              | list }}
          active_entities: >
            {{ expand(group_entity_id)
              | selectattr('state', 'eq', 'on')
              | map(attribute='entity_id')
              | list }}
          title: 💧 Leak Detected
          message: >
            {% set active_entities = this.attributes.get('active_entities', []) %}
            {% set entity_count = active_entities | count %}
            {% if entity_count == 0 %}
              All sensors dry.
            {% else %}
              {{ active_entities
                | map('state_attr', 'friendly_name')
                | join(', ') }} {{ 'is' if entity_count == 1 else 'are' }} wet.
            {% endif %}
          # Retains the most recent non-empty wet list (names) so the
          # recovery notification can say WHAT dried out — active_entities
          # is already empty again by the time the recovery is dispatched.
          # this.attributes reads the previous render.
          last_wet_sensors: >
            {% set active = this.attributes.get('active_entities', []) %}
            {% if active | count > 0 %}
              {{ active | map('state_attr', 'friendly_name') | list }}
            {% else %}
              {{ this.attributes.get('last_wet_sensors', []) }}
            {% endif %}
          # Picked up by the Alert Dispatcher's recovery path.
          recovery_message: >
            {% set last = this.attributes.get('last_wet_sensors', []) %}
            {% if last | count > 0 %}
              {{ last | join(', ') }} dry again.
            {% else %}
              Sensors dry again.
            {% endif %}
          source_entity_id: >
            {{ group_entity_id }}

alert:
  p1_leak:
    name: Leak
    entity_id: binary_sensor.p1_leak_trigger
    state: 'on'
    can_acknowledge: true
    skip_first: false
    notifiers: p1_alert
    repeat: 30
    title: >
      {{ state_attr('binary_sensor.p1_leak_trigger', 'title') }}
    message: >
      {{ state_attr('binary_sensor.p1_leak_trigger', 'message') }}
    done_message: >
      {{ state_attr('binary_sensor.p1_leak_trigger', 'recovery_message') }}
      Recovered at {{ as_local(states.binary_sensor.p1_leak_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p1_leak
      group: ha
      url: /dashboard-lavender/alerts
      push:
        interruption-level: critical
      actions:
        - action: alert.p1_leak.mute
          title: Mute
          icon: sfsymbols:bell.slash