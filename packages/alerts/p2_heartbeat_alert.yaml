# Heartbeat
# General
#
---
homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts/p2_heartbeat_alert

    alert.p2_heartbeat:
      <<: *package
    automation.heartbeat_auto_send:
      <<: *package
    binary_sensor.p2_heartbeat_trigger:
      <<: *package
    input_datetime.last_successful_heartbeat:
      <<: *package
    rest_command.send_heartbeat:
      <<: *package

#
# Send Heartbeat REST request to status.toddhgardner.com
#
rest_command:
  send_heartbeat:
    url: https://status.toddhgardner.com/api/push/mX7UpqFKLYrIfKCma8uYaYMLw1eMqwC0?status={{status | urlencode}}&msg={{msg | urlencode}}&ping={{ping | urlencode}}
    method: GET
    timeout: 10

#
# Custom sensor to store the last successful heartbeat time
#
input_datetime:
  last_successful_heartbeat:
    name: Last Successful Heartbeat
    has_date: true
    has_time: true

#
# Heartbeat automation to send status to the remote monitor
#
automation:
  - id: heartbeat_auto_send
    alias: Heartbeat Auto Send
    description: "Send system heartbeat to status.toddhgardner.com."
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    actions:
      - action: rest_command.send_heartbeat
        data:
          status: "up"
          msg: >
            uptime: {{ relative_time(as_datetime(states('sensor.uptime'))) }}
          ping: >
            {{ states('sensor.status_toddhgardner_com_round_trip_time_average') }}
        response_variable: heartbeat_result
      - if:
          - condition: template
            value_template: >
              {{ heartbeat_result['status'] == 200 }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.last_successful_heartbeat
            data:
              timestamp: >
                {{ now().timestamp() }}

template:
  - binary_sensor:
      - name: P2 Heartbeat Trigger
        unique_id: p2_heartbeat_trigger
        state: >
          {{ now().timestamp() - state_attr('input_datetime.last_successful_heartbeat', 'timestamp') > 300 }}
        attributes:
          device_class: problem
          source_entity_id: "input_datetime.last_successful_heartbeat"
          title: 💔 No heartbeat
          message: >
            {% if this.state %}No heartbeat since {{ as_datetime(state_attr('input_datetime.last_successful_heartbeat', 'timestamp')).strftime('%a %b %-d, %-I:%M %p') }}
            {% else %}Heartbeat recovered
            {% endif %}

alert:
  p2_heartbeat:
    name: Heartbeat Warning
    entity_id: binary_sensor.p2_heartbeat_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: persistent_notification
    repeat:
      - 60
      - 1440
    title: >
      {{ state_attr('binary_sensor.p2_heartbeat_trigger', 'title') }}
    message: >
      {{ state_attr('binary_sensor.p2_heartbeat_trigger', 'message') }}
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p2_heartbeat_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_heartbeat
      group: ha
      url: /dashboard-lavender/alerts
      actions:
        - action: alert.p2_heartbeat.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"