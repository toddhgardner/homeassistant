# Refrigerator Temperature Alert
# Alerts
#
---

homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts/p2_refrigerator_temperature_alert

    alert.p2_refrigerator_temperature:
      <<: *package
    binary_sensor.p2_refrigerator_temperature_trigger:
      <<: *package

template:
  - binary_sensor:
      - name: P2 Refrigerator Temperature Trigger
        unique_id: p2_refrigerator_temperature_trigger
        variables:
          label: Refrigerator
        state: >
          {{ this.attributes.get('active_entities', []) | count > 0 }}
        delay_on:
          minutes: 60
        availability: >
          {% set labeled_entities = label_entities(label) %}
          {{ states.binary_sensor
            | selectattr('entity_id', 'in', labeled_entities)
            | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
            | map(attribute='entity_id')
            | list | count > 0 }}
        attributes:
          device_class: problem
          monitored_entities: >
            {{ label_entities(label) }}
          active_entities: >
            {% set labeled_entities = label_entities(label) | list %}
            {{ states.binary_sensor
              | selectattr('entity_id', 'in', labeled_entities)
              | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
              | selectattr('state', 'eq', 'off')
              | map(attribute='entity_id')
              | list }}
          title: ❄️ Refrigerator Temperature Range
          message: >
            {% set active_entities = this.attributes.get('active_entities', []) %}
            {% if active_entities | count == 0 %}
              All refrigerators in range.
            {% else %}
              {% set ns = namespace(parts=[]) %}
              {% for e in active_entities %}
                {% set src = state_attr(e, 'entity_id') %}
                {% set ns.parts = ns.parts + [state_attr(src, 'friendly_name')
                  ~ ' (' ~ states(src, rounded=True, with_unit=True) ~ ') is '
                  ~ state_attr(e, 'position') ~ ' its range ('
                  ~ state_attr(e, 'lower') ~ ' - ' ~ state_attr(e, 'upper') ~ ')'] %}
              {% endfor %}
              {{ ns.parts | join(', ') }}.
            {% endif %}
          # Retained so the recovery can say what cleared — same pattern
          # as p1_leak_alert.yaml (this.attributes reads the previous render).
          last_out_of_range: >
            {% set active = this.attributes.get('active_entities', []) %}
            {% if active | count > 0 %}
              {% set ns = namespace(names=[]) %}
              {% for e in active %}
                {% set ns.names = ns.names + [state_attr(state_attr(e, 'entity_id'), 'friendly_name')] %}
              {% endfor %}
              {{ ns.names }}
            {% else %}
              {{ this.attributes.get('last_out_of_range', []) }}
            {% endif %}
          recovery_message: >
            {% set last = this.attributes.get('last_out_of_range', []) %}
            {% if last | count > 0 %}
              {{ last | join(', ') }} back in range.
            {% else %}
              Refrigerators back in range.
            {% endif %}
          source_entity_id: >
            {% set active_entities = this.attributes.get('active_entities', []) %}
            {% if active_entities | count > 0 %}
              {{ state_attr(active_entities | first, 'entity_id') }}
            {% else %}
              {{ this.entity_id }}
            {% endif %}

alert:
  p2_refrigerator_temperature:
    name: Refrigerator Temperature
    entity_id: binary_sensor.p2_refrigerator_temperature_trigger
    state: 'on'
    can_acknowledge: true
    skip_first: false
    notifiers: persistent_notification
    repeat:
      - 1440
    title: >
      {{ state_attr('binary_sensor.p2_refrigerator_temperature_trigger', 'title') }}
    message: >
      {{ state_attr('binary_sensor.p2_refrigerator_temperature_trigger', 'message') }}
    done_message: >
      {{ state_attr('binary_sensor.p2_refrigerator_temperature_trigger', 'recovery_message') }}
      Recovered at {{ as_local(states.binary_sensor.p2_refrigerator_temperature_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_refrigerator_temperature
      group: ha
      url: /dashboard-lavender/alerts
      actions:
        - action: alert.p2_refrigerator_temperature.mute
          title: 'Mute'
          icon: 'sfsymbols:bell.slash'