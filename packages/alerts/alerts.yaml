# Alerting Core
# Alerts
#
# Core alerting and notification functionality.
---

homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts

    automation.alert_action_handler:
      <<: *package
    automation.alert_daily_unmute:
      <<: *package
    automation.alert_dispatcher:
      <<: *package
    sensor.p1_alert_count:
      <<: *package
    sensor.p2_alert_count:
      <<: *package
    sensor.p3_alert_count:
      <<: *package

template:
  - sensor:
      - name: P1 Alert Count
        unique_id: p1_alert_count
        icon: mdi:alert-box
        state: >
          {{ states.alert
            | selectattr('object_id', 'match', '^p1_')
            | selectattr('state', 'ne', 'idle')
            | list
            | count }}
      - name: P2 Alert Count
        unique_id: p2_alert_count
        icon: mdi:alert
        state: >
          {{ states.alert
            | selectattr('object_id', 'match', '^p2_')
            | selectattr('state', 'ne', 'idle')
            | list
            | count }}
      - name: P3 Alert Count
        unique_id: p3_alert_count
        icon: mdi:alert-circle-outline
        state: >
          {{ states.alert
            | selectattr('object_id', 'match', '^p3_')
            | selectattr('state', 'ne', 'idle')
            | list
            | count }}

#
# Automations
#
automation:

  # Mobile Notification Action Handler
  # Processes notification actions back to HA Actions in the format:
  # alert.<entity>.<action>
  - id: alert_action_handler
    alias: Notification Action Handler
    description: >
      Handle notification action events and execute the correct system action.
    mode: parallel
    max: 10
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.action.startswith('alert.') }}
    actions:
      - variables:
          action_parts: "{{ trigger.event.data.action.split('.') }}"
          action_entity_id: "{{ action_parts[0] + '.' + action_parts[1] }}"
          action_command: "{{ action_parts[2] }}"
      - choose:
          # Mute alert
          - conditions:
              - condition: template
                value_template: "{{ action_command == 'mute' }}"
            sequence:
              - action: alert.turn_off
                target:
                  entity_id: "{{ action_entity_id }}"
          # Unmute alert
          - conditions:
              - condition: template
                value_template: "{{ action_command == 'unmute' }}"
            sequence:
              - action: alert.turn_on
                target:
                  entity_id: "{{ action_entity_id }}"

  # Alert Dispatcher
  # Single automation that handles all push notification delivery for P1 and P2 alerts.
  #
  # P1 alerts (notifiers: p1_alert):
  #   - Alert entity handles notify.P1_alert directly (with repeat every 30 min).
  #   - Dispatcher sends to household members at home on trigger and recovery.
  #   - No time gate — P1 fires any time.
  #
  # P2 alerts (notifiers: persistent_notification):
  #   - Dispatcher is the sole push source for P2s.
  #   - Gated to active hours only — overnight P2s surface via morning digest.
  #   - Sends to notify.p2_alert + household members at home.
  #
  # P3 alerts (notifiers: persistent_notification):
  #   - Same delivery path as P2, but Todd only — the household loop is skipped.
  #   - For alerts nobody else can act on (device offline, system usage).
  #   - Gated to active hours; digested at 8am like P2.
  #
  # Only fires on idle→on (new trigger) or on→idle (recovery).
  # The off→on transition from daily unmute is intentionally excluded.
  # Todd is excluded from the household loop — P1 alert entity covers him,
  # and P2 notify.p2_alert covers him.
  #
  # Every transition is logged to the system event log regardless of active
  # hours — only the pushes are gated, so the Ops history stays complete.
  #
  # Recovery notifications reuse the SAME title as the firing so emails
  # thread together; the recovery detail lives in the message. A trigger
  # sensor can provide a recovery_message attribute (e.g. the list of
  # devices that came back) — otherwise a plain "Resolved at" is sent.
  - id: alert_dispatcher
    alias: Alert Dispatcher
    description: >
      Delivers push notifications for all P1, P2 and P3 alerts.
    mode: parallel
    max: 10
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >
          {{ (trigger.event.data.entity_id.startswith('alert.p1_') or
              trigger.event.data.entity_id.startswith('alert.p2_') or
              trigger.event.data.entity_id.startswith('alert.p3_'))
             and trigger.event.data.new_state is not none
             and trigger.event.data.old_state is not none
             and (
               (trigger.event.data.old_state.state == 'idle' and trigger.event.data.new_state.state == 'on')
               or
               (trigger.event.data.old_state.state == 'on' and trigger.event.data.new_state.state == 'idle')
             ) }}
    actions:
      - variables:
          alert_entity_id: "{{ trigger.event.data.entity_id }}"
          is_p1: "{{ alert_entity_id.startswith('alert.p1_') }}"
          is_p3: "{{ alert_entity_id.startswith('alert.p3_') }}"
          priority_notifier: "{{ 'notify.' ~ alert_entity_id.split('.')[1][:2] ~ '_alert' }}"
          new_state: "{{ trigger.event.data.new_state.state }}"
          trigger_entity_id: >
            {{ alert_entity_id | replace('alert.', 'binary_sensor.') + '_trigger' }}
          title: >
            {{ state_attr(trigger_entity_id, 'title')
               | default(state_attr(alert_entity_id, 'friendly_name'), true) }}
          message: >
            {{ state_attr(trigger_entity_id, 'message') | default('') | trim }}
          # Optional per-trigger recovery detail (e.g. which devices came
          # back). None for triggers that don't define it.
          recovery_detail: "{{ state_attr(trigger_entity_id, 'recovery_message') }}"
          recovery_message: >
            {{ (recovery_detail | trim ~ ' ') if recovery_detail else '' }}Resolved at {{ now().strftime('%a %b %-d, %-I:%M %p') }}
          # P3 is Todd-only by definition — never fan out to the house.
          others_at_home: >
            {% if is_p3 %}
              []
            {% else %}
              {{ expand('group.household')
                | selectattr('state', 'eq', 'home')
                | rejectattr('entity_id', 'eq', 'person.todd_gardner')
                | map(attribute='entity_id')
                | list }}
            {% endif %}
      # Always log, even overnight when the push is suppressed.
      - action: logbook.log
        continue_on_error: true
        data:
          name: System
          message: >-
            {%- set alert_name = state_attr(alert_entity_id, 'friendly_name') | lower -%}
            {%- if new_state == 'on' -%}
              {{ alert_name }} alert fired: {{ message }}
            {%- else -%}
              {{ alert_name }} alert recovered{{ (': ' ~ recovery_detail | trim) if recovery_detail else '' }}
            {%- endif -%}
          entity_id: input_boolean.log_event
      - choose:
          # P1 new alert — household at home only (alert entity handles Todd)
          - conditions:
              - condition: template
                value_template: "{{ is_p1 and new_state == 'on' }}"
            sequence:
              - repeat:
                  for_each: "{{ others_at_home }}"
                  sequence:
                    - action: "{{ state_attr(repeat.item, 'notify') }}"
                      data:
                        title: "{{ title }}"
                        message: "{{ message }}"
                        data:
                          tag: "{{ alert_entity_id }}"
                          group: ha
                          url: /dashboard-lavender/alerts
                          push:
                            interruption-level: critical

          # P1 recovery — household at home only (alert entity done_message handles Todd)
          - conditions:
              - condition: template
                value_template: "{{ is_p1 and new_state == 'idle' }}"
            sequence:
              - repeat:
                  for_each: "{{ others_at_home }}"
                  sequence:
                    - action: "{{ state_attr(repeat.item, 'notify') }}"
                      data:
                        title: "{{ title }}"
                        message: "{{ recovery_message }}"
                        data:
                          tag: "{{ alert_entity_id }}"
                          group: ha
                          url: /dashboard-lavender/alerts

          # P2/P3 new alert — Todd (+ household at home for P2 only)
          - conditions:
              - condition: template
                value_template: "{{ not is_p1 and new_state == 'on' and is_state('schedule.active_hours', 'on') }}"
            sequence:
              - action: "{{ priority_notifier }}"
                data:
                  title: "{{ title }}"
                  message: "{{ message }}"
                  data:
                    tag: "{{ alert_entity_id }}"
                    group: ha
                    url: /dashboard-lavender/alerts
                    actions:
                      - action: "{{ alert_entity_id }}.mute"
                        title: Mute
                        icon: sfsymbols:bell.slash
              - repeat:
                  for_each: "{{ others_at_home }}"
                  sequence:
                    - action: "{{ state_attr(repeat.item, 'notify') }}"
                      data:
                        title: "{{ title }}"
                        message: "{{ message }}"
                        data:
                          tag: "{{ alert_entity_id }}"
                          group: ha
                          url: /dashboard-lavender/alerts

          # P2/P3 recovery — Todd (+ household at home for P2 only)
          - conditions:
              - condition: template
                value_template: "{{ not is_p1 and new_state == 'idle' and is_state('schedule.active_hours', 'on') }}"
            sequence:
              - action: "{{ priority_notifier }}"
                data:
                  title: "{{ title }}"
                  message: "{{ recovery_message }}"
                  data:
                    tag: "{{ alert_entity_id }}"
                    group: ha
                    url: /dashboard-lavender/alerts
              - repeat:
                  for_each: "{{ others_at_home }}"
                  sequence:
                    - action: "{{ state_attr(repeat.item, 'notify') }}"
                      data:
                        title: "{{ title }}"
                        message: "{{ recovery_message }}"
                        data:
                          tag: "{{ alert_entity_id }}"
                          group: ha
                          url: /dashboard-lavender/alerts

  # Daily Re-enable Muted Alerts
  # Unmutes any muted alerts, then sends a push digest of any P2 alerts
  # that are still active (including those just unmuted).
  - id: alert_daily_unmute
    alias: Daily Re-enable Muted Alerts
    description: >
      Re-enables any muted alerts daily at 8am to prevent forgetting about them.
      Also sends a morning push digest of any active P2 alerts so overnight
      triggers are not silently missed.
    triggers:
      - trigger: time
        at: "08:00:00"
    actions:
      - action: alert.turn_on
        target:
          entity_id: >
            {{ states.alert
              | selectattr('state', 'eq', 'off')
              | map(attribute='entity_id')
              | list }}
      # Keep these as entity_id lists. A variables: block stringifies its
      # result, and a list of state objects can't round-trip — downstream
      # filters then iterate the string one character at a time, which is
      # how the digest once sent a message of nothing but commas.
      - variables:
          active_p2s: >
            {{ states.alert
              | selectattr('object_id', 'match', '^p2_')
              | selectattr('state', 'ne', 'idle')
              | map(attribute='entity_id')
              | list }}
          active_p3s: >
            {{ states.alert
              | selectattr('object_id', 'match', '^p3_')
              | selectattr('state', 'ne', 'idle')
              | map(attribute='entity_id')
              | list }}
          others_at_home: >
            {{ expand('group.household')
              | selectattr('state', 'eq', 'home')
              | rejectattr('entity_id', 'eq', 'person.todd_gardner')
              | map(attribute='entity_id')
              | list }}
      - if:
          - condition: template
            value_template: "{{ active_p2s | count > 0 }}"
        then:
          - action: notify.p2_alert
            data:
              title: "⚠️ Active P2 Alerts"
              message: >
                {{ active_p2s | map('state_attr', 'friendly_name') | join(', ') }}
              data:
                group: ha
                url: /dashboard-lavender/alerts
          - repeat:
              for_each: "{{ others_at_home }}"
              sequence:
                - action: "{{ state_attr(repeat.item, 'notify') }}"
                  data:
                    title: "⚠️ Active P2 Alerts"
                    message: >
                      {{ active_p2s | map('state_attr', 'friendly_name') | join(', ') }}
                    data:
                      group: ha
                      url: /dashboard-lavender/alerts
      - if:
          - condition: template
            value_template: "{{ active_p3s | count > 0 }}"
        then:
          - action: notify.p3_alert
            data:
              title: "ℹ️ Active P3 Alerts"
              message: >
                {{ active_p3s | map('state_attr', 'friendly_name') | join(', ') }}
              data:
                group: ha
                url: /dashboard-lavender/alerts