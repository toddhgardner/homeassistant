# Device Offline Alert
# Alerts
#
---

homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts/p3_device_offline_alert

    alert.p3_device_offline:
      <<: *package
    binary_sensor.p3_device_offline_trigger:
      <<: *package

template:
  - binary_sensor:
      - name: P3 Device Offline Trigger
        unique_id: p3_device_offline_trigger
        variables:
          label: Production
        state: >
          {{ this.attributes.get('active_devices', []) | count > 0 }}
        # Raised from 10 min: z-wave nodes that flap (dead ~14 min, then
        # revived by the hourly Z-Wave Heartbeat ping) were tripping the alert
        # AND a recovery push. 30 min still catches a genuinely dead device
        # inside the hour.
        delay_on:
          minutes: 30
        availability: >
          {{ label_devices(label) | count > 0 }}
        attributes:
          device_class: problem
          monitored_devices: >
            {% set ns = namespace(devices=[]) %}
            {% set prod_devices = label_devices(label) %}
            {% for device_id in prod_devices %}
              {% set ns.devices = ns.devices + [device_name(device_id)] %}
            {% endfor %}
            {{ ns.devices }}
          active_devices: >
            {% set ns = namespace(active_devices=[]) %}
            {% set prod_devices = label_devices(label) %}
            {% set ping_entities = integration_entities('ping') %}
            {# The Bond bridge answers ping even when HA's session to it is
               broken (every bond entity unavailable while the hub itself is
               up and working), so the ping test alone cannot see that
               failure. Treat the whole integration being unavailable as the
               bridge being offline, attributed to its Production ping
               device, which is named 'Bond Bridge'. #}
            {% set bond_states = integration_entities('bond') | map('states') | list %}
            {% set bond_down = bond_states | count > 0
              and bond_states
                | reject('in', ['unavailable', 'unknown', 'none'])
                | list | count == 0 %}
            {% for device_id in prod_devices %}
              {% set device_entities = states
                | selectattr('entity_id', 'in', device_entities(device_id))
                | rejectattr('domain', 'in', ['update'])
                | list %}
              {% set entity_count = device_entities | count %}
              {% set entity_offline_count = device_entities
                | selectattr('state', 'in', ['unavailable', 'unknown', 'none'])
                | list | count %}
              {# Dead z-wave nodes keep stale entity states (zwave_js availability
                 ignores node status), so also check the node status sensor. #}
              {% set node_dead = device_entities
                | selectattr('entity_id', 'search', '_node_status$')
                | selectattr('state', 'eq', 'dead')
                | list | count > 0 %}
              {# A hub with no entities of its own (the Bond bridge has none) is
                 monitored by giving it a Ping sensor. A failed ping reads 'off',
                 never 'unavailable', so the count test above cannot see it.
                 Deliberately limited to ping entities: other integrations use
                 device_class connectivity for things that are not reachability,
                 e.g. Konnected's 'synced' sensor on the garage openers. #}
              {% set ping_down = device_entities
                | selectattr('entity_id', 'in', ping_entities)
                | selectattr('attributes.device_class', 'defined')
                | selectattr('attributes.device_class', 'eq', 'connectivity')
                | selectattr('state', 'eq', 'off')
                | list | count > 0 %}
              {% set bond_hub_down = bond_down
                and device_name(device_id) == 'Bond Bridge' %}
              {# The entity_count > 0 guard matters: a device with no entities
                 makes 0 == 0 true and would report offline forever. #}
              {% if (entity_count > 0 and entity_offline_count == entity_count)
                    or node_dead or ping_down or bond_hub_down %}
                {% set ns.active_devices = ns.active_devices + [device_id] %}
              {% endif %}
            {% endfor %}
            {{ ns.active_devices }}
          title: 🛜 Device Offline
          message: >
            {% set active_devices = this.attributes.get('active_devices', []) %}
            {% set device_count = active_devices | count %}
            {% if device_count == 0 %}
              All devices online.
            {% else %}
              {# Name every offline device. "X and 1 others" hid the Bond
                 Bridge behind a flapping switch on 8/1 and the outage was
                 missed even though the push went out. #}
              {% set ns = namespace(names=[]) %}
              {% for d in active_devices %}
                {% set ns.names = ns.names + [device_name(d)] %}
              {% endfor %}
              {{ ns.names | join(', ') }} {{ 'is' if device_count == 1 else 'are' }} offline.
            {% endif %}
          # Retains the most recent non-empty offline list (names) so the
          # recovery notification can say WHAT came back — active_devices is
          # already empty again by the time the recovery is dispatched.
          # this.attributes reads the previous render, so on the render that
          # clears active_devices this still sees the outgoing list.
          last_offline_devices: >
            {% set active = this.attributes.get('active_devices', []) %}
            {% if active | count > 0 %}
              {% set ns = namespace(names=[]) %}
              {% for d in active %}
                {% set ns.names = ns.names + [device_name(d)] %}
              {% endfor %}
              {{ ns.names }}
            {% else %}
              {{ this.attributes.get('last_offline_devices', []) }}
            {% endif %}
          # Picked up by the Alert Dispatcher's recovery path.
          recovery_message: >
            {% set last = this.attributes.get('last_offline_devices', []) %}
            {% if last | count > 0 %}
              {{ last | join(', ') }} back online.
            {% else %}
              Devices back online.
            {% endif %}
          source_entity_id: >
            {{ this.entity_id }}
          device_id: >
            {% set active_devices = this.attributes.get('active_devices', []) %}
            {{ active_devices | first | default('') }}

alert:
  p3_device_offline:
    name: Device Offline
    entity_id: binary_sensor.p3_device_offline_trigger
    state: 'on'
    can_acknowledge: true
    skip_first: false
    notifiers: persistent_notification
    repeat:
      - 1440
    title: >
      {{ state_attr('binary_sensor.p3_device_offline_trigger', 'title') }}
    message: >
      {{ state_attr('binary_sensor.p3_device_offline_trigger', 'message') }}
    done_message: >
      {{ state_attr('binary_sensor.p3_device_offline_trigger', 'recovery_message') }}
      Recovered at {{ as_local(states.binary_sensor.p3_device_offline_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p3_device_offline
      group: ha
      url: /dashboard-lavender/alerts
      actions:
        - action: alert.p3_device_offline.mute
          title: Mute
          icon: sfsymbols:bell.slash