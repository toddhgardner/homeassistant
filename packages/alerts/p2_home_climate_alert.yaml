# Home Climate Alert
# Alerts
#
---

homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: alerts/p2_home_climate_alert

    alert.p2_home_climate:
      <<: *package
    binary_sensor.p2_home_climate_trigger:
      <<: *package

template:
  - binary_sensor:
      - name: P2 Home Climate Trigger
        unique_id: p2_home_climate_trigger
        variables:
          label: Home Climate
        state: >
          {{ this.attributes.get('active_entities', []) | count > 0 }}
        delay_on:
          seconds: 10
        availability: >
          {% set labeled_entities = label_entities(label) %}
          {{ states.binary_sensor
            | selectattr('entity_id', 'in', labeled_entities)
            | selectattr('attributes.device_class', 'eq', 'problem')
            | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
            | list | count > 0}}
        attributes:
          device_class: problem
          monitored_entities: >
            {% set labeled_entities = label_entities(label) %}
            {{ states.binary_sensor
              | selectattr('entity_id', 'in', labeled_entities)
              | selectattr('attributes.device_class', 'eq', 'problem')
              | map(attribute='entity_id')
              | list }}
          active_entities: >
            {% set labeled_entities = label_entities(label) %}
            {{ states.binary_sensor
              | selectattr('entity_id', 'in', labeled_entities)
              | selectattr('attributes.device_class', 'eq', 'problem')
              | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
              | selectattr('state', 'eq', 'on')
              | map(attribute='entity_id')
              | list }}
          title: 🌡️ Home Climate Warning
          message: >
            {% set active_entities = this.attributes.get('active_entities', []) %}
            {% if active_entities | count == 0 %}
              Home climate normal.
            {% else %}
              {% set ns = namespace(parts=[]) %}
              {% for e in active_entities %}
                {% set src = state_attr(e, 'entity_id') | default(e, true) %}
                {% set ns.parts = ns.parts + [state_attr(src, 'friendly_name')
                  ~ ' is ' ~ state_attr(e, 'position') ~ ' range at '
                  ~ states(src, rounded=True, with_unit=True)] %}
              {% endfor %}
              {{ ns.parts | join(', ') }}.
            {% endif %}
          # Retained so the recovery can say what cleared — same pattern
          # as p1_leak_alert.yaml (this.attributes reads the previous render).
          last_out_of_range: >
            {% set active = this.attributes.get('active_entities', []) %}
            {% if active | count > 0 %}
              {% set ns = namespace(names=[]) %}
              {% for e in active %}
                {% set src = state_attr(e, 'entity_id') | default(e, true) %}
                {% set ns.names = ns.names + [state_attr(src, 'friendly_name')] %}
              {% endfor %}
              {{ ns.names }}
            {% else %}
              {{ this.attributes.get('last_out_of_range', []) }}
            {% endif %}
          recovery_message: >
            {% set last = this.attributes.get('last_out_of_range', []) %}
            {% if last | count > 0 %}
              {{ last | join(', ') }} back in range.
            {% else %}
              Climate back in range.
            {% endif %}
          source_entity_id: >
            {% set active_entities = this.attributes.get('active_entities', []) %}
            {% if active_entities | count > 0 %}
              {% set entity_first = active_entities | first %}
              {% set entity_source = state_attr(entity_first, 'entity_id') | default(entity_first, true) %}
              {{ entity_source }}
            {% else %}
              {{ this.entity_id }}
            {% endif %}

alert:
  p2_home_climate:
    name: Home Climate
    entity_id: binary_sensor.p2_home_climate_trigger
    state: 'on'
    can_acknowledge: true
    skip_first: false
    notifiers: persistent_notification
    repeat:
      - 1440
    title: >
      {{ state_attr('binary_sensor.p2_home_climate_trigger', 'title') }}
    message: >
      {{ state_attr('binary_sensor.p2_home_climate_trigger', 'message') }}
    done_message: >
      {{ state_attr('binary_sensor.p2_home_climate_trigger', 'recovery_message') }}
      Recovered at {{ as_local(states.binary_sensor.p2_home_climate_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_home_climate
      group: ha
      url: /dashboard-lavender/alerts
      actions:
        - action: alert.p2_home_climate.mute
          title: 'Mute'
          icon: 'sfsymbols:bell.slash'