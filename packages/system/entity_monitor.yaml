# Entity Monitor
# System
#
# Monitor the availability of entities critical to defined automations and alerts.
---
#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: system/entity_monitor

    #
    # Programmatic entities defined in this package
    #
    alert.p2_entity_availability:
      <<: *package
    alert.p2_entity_battery:
      <<: *package
    binary_sensor.p2_entity_availability_trigger:
      <<: *package
    binary_sensor.p2_entity_battery_trigger:
      <<: *package

template:
  - binary_sensor:

    #
    # Entity Availability Trigger
    # Monitors all devices and entities labeld "Essential"
    #
    - name: p2_entity_availability_trigger
      state: "{{ this.attributes.get('entities', []) | count > 0 }}"
      delay_on:
        minutes: 5
      availability: >
        {% from 'labeled_all_entities.jinja' import labeled_all_entities %}
        {% set all_entities = labeled_all_entities('Essential', as_array) %}
        {{ states
          | selectattr('entity_id', 'in', all_entities)
          | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
          | list | count > 0 }}
      attributes:
        device_class: problem
        entities: >
          {% from 'labeled_all_entities.jinja' import labeled_all_entities %}
          {% set all_entities = labeled_all_entities('Essential', as_array) %}
          {{ states
            | selectattr('entity_id', 'in', all_entities)
            | rejectattr('domain', 'in', ['button', 'update'])
            | selectattr('state', 'in', ['unavailable', 'unknown', 'none'])
            | map(attribute="entity_id", default="Unknown")
            | list }}
        message: >
          {% set entities = this.attributes.get('entities', []) %}
          {% set entity_count = entities | count %}
          {% set entity_first = state_attr(entities | first | default(''), 'friendly_name') %}
          {% if entity_count == 0 %}All entities available
          {% elif entity_count == 1 %}{{ entity_first }} is unavailable
          {% else %}{{ entity_first }} and {{ entity_count - 1 }} others are unavailable
          {% endif %}
        source_entity_id: "{{ this.entity_id }}"
        title: 🛜 Entity unavailable

    #
    # Entity Battery Trigger
    # Monitors all devices and entities labeld "Essential" for battery
    #
    - name: p2_entity_battery_trigger
      state: "{{ this.attributes.get('entities', []) | count > 0 }}"
      availability: >
        {% from 'labeled_all_entities.jinja' import labeled_all_entities %}
        {% set all_entities = labeled_all_entities('Essential', as_array) %}
        {{ states
          | selectattr('entity_id', 'in', all_entities)
          | selectattr('attributes.device_class', 'eq', 'battery')
          | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])
          | list | count > 0 }}
      attributes:
        device_class: problem
        entities: >
          {% from 'labeled_all_entities.jinja' import labeled_all_entities %}
          {% set all_entities = labeled_all_entities('Essential', as_array) %}
          {% set ns = namespace(entities=[]) %}
          {% for entity in states.sensor
            | selectattr('entity_id', 'in', all_entities)
            | selectattr('attributes.device_class', 'eq', 'battery')
            | rejectattr('state', 'in', ['unknown', 'unavailable', 'none']) %}
              {% set battery_level = states(entity.entity_id) | int(100) %}
              {% if battery_level <= 20 %}
                {% set ns.entities = ns.entities + [entity.entity_id] %}
              {% endif %}
          {% endfor %}
          {{ ns.entities }}
        message: >
          {% set entities = this.attributes.get('entities', []) %}
          {% set entity_count = entities | count %}
          {% set entity_first = entities | first | default('') %}
          {% if entity_count == 0 %}All sensors powered
          {% elif entity_count == 1 %}{{ state_attr(entity_first, 'friendly_name') }} is {{ states(entity_first, rounded=True, with_unit=True) }}
          {% else %}{{ state_attr(entity_first, 'friendly_name') }} ({{ states(entity_first, rounded=True, with_unit=True) }}) and {{ entity_count - 1 }} others have low battery
          {% endif %}
        source_entity_id: "{{ this.entity_id }}"
        title: 🪫 Device battery low

#
# Alerts
#
alert:

  p2_entity_availability:
    name: Entity Availability Warning
    entity_id: binary_sensor.p2_entity_availability_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p2_warning
    repeat: 60
    title: "{{ state_attr('binary_sensor.p2_entity_availability_trigger', 'title') }}"
    message: "{{ state_attr('binary_sensor.p2_entity_availability_trigger', 'message') }}"
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p2_entity_availability_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_entity_availability
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      actions:
        - action: alert.p2_entity_availability.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"

  p2_entity_battery:
    name: Entity Battery Warning
    entity_id: binary_sensor.p2_entity_battery_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p2_warning
    repeat: 60
    title: "{{ state_attr('binary_sensor.p2_entity_battery_trigger', 'title') }}"
    message: "{{ state_attr('binary_sensor.p2_entity_battery_trigger', 'message') }}"
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p2_entity_battery_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_entity_battery
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      actions:
        - action: alert.p2_entity_battery.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"