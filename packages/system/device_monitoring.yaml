# Device Monitoring
# System
#
# Monitor the availability of devices critical to defined automations and alerts.
---
#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: system/device_monitoring

    #
    # Programmatic entities defined in this package
    #
    alert.p2_device_status:
      <<: *package

    binary_sensor.p2_device_status_trigger:
      <<: *package

    input_select.test_status:
      <<: *package
      friendly_name: Test Status

#
# Test Sensor
#
input_select:
  test_status:
    options:
      - on
      - "unknown"
    initial: on

#
# Alert Triggers
#
template:

  - binary_sensor:
      - name: p2_device_status_trigger
        state: "{{ this.attributes.get('devices', []) | count > 0 }}"
        delay_on:
          minutes: 5
        attributes:
          source_entity_id: "binary_sensor.p2_device_status_trigger" # self
          devices: >
            {{ states
              | selectattr('attributes.device_monitoring', 'defined')
              | selectattr('state', 'in', ['unavailable', 'unknown', 'none'])
              | map(attribute="attributes.friendly_name", default="Unknown")
              | list }}
          title: 🛜 Device unavailable
          message: >
            {% set devices = this.attributes.get('devices', []) %}
            {% set devices_count = devices | count %}
            {% set devices_first = devices | first %}
            {% if devices_count == 0 %}All devices online
            {% elif devices_count == 1 %}{{ devices_first }} is unavailable
            {%- else -%}{{ devices_first }} and {{ devices_count - 1 }} others are unavailable
            {%- endif -%}

#
# Alerts
#
alert:

  p2_device_status:
    name: Device Status Warning
    entity_id: binary_sensor.p2_device_status_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p2_warning
    repeat:
      - 120
      - 240
    title: "{{ state_attr('binary_sensor.p2_device_status_trigger', 'title') }}"
    message: "{{ state_attr('binary_sensor.p2_device_status_trigger', 'message') }}"
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p2_device_status_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_device_status
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      actions:
        - action: alert.p2_device_status.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"
