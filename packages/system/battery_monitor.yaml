# Battery Monitor
# System
#
# Monitor the status of device batteries
---

#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: system/battery_monitor
      ety: &entity
        entity_monitor: on
        battery_monitor: on

    #
    # Programmatic entities defined in this package
    #
    alert.p2_device_battery:
      <<: *package
    binary_sensor.p2_device_battery_trigger:
      <<: *package
    sensor.test_battery:
      <<: *package

    input_number.test_battery:
      <<: *package

    #
    # Sensors needed to function
    #
    sensor.basement_bath_leak_battery:
      <<: *entity
    sensor.garage_freezer_monitor_battery:
      <<: *entity
    sensor.guest_bath_leak_battery:
      <<: *entity
    sensor.half_bath_leak_battery:
      <<: *entity
    sensor.kitchen_dishwasher_leak_battery:
      <<: *entity
    sensor.kitchen_pantry_door_battery:
      <<: *entity
    sensor.kitchen_refrigerator_leak_battery:
      <<: *entity
    sensor.kitchen_sink_leak_battery:
      <<: *entity
    sensor.laundry_leak_battery:
      <<: *entity
    sensor.mudroom_closet_door_battery:
      <<: *entity
    sensor.primary_bath_toilet_leak_battery:
      <<: *entity
    sensor.primary_bath_tub_leak_battery:
      <<: *entity
    sensor.suite_bath_leak_battery:
      <<: *entity
    sensor.utility_drain_leak_battery:
      <<: *entity

#
# Toggle Test Sensor
#
input_number:
  test_battery:
    initial: 100
    max: 100
    min: 0

#
# Alert Triggers
#
template:

  #
  # Test Sensor
  #
  - sensor:
      - name: test_battery
        state: "{{ states('input_number.test_battery') }}"
        attributes:
          battery_monitor: on
          device_class: battery
          unit_of_measurement: "%"

  - binary_sensor:
      - name: p2_device_battery_trigger
        state: "{{ this.attributes.get('entities', []) | count > 0 }}"
        attributes:
          device_class: problem
          source_entity_id: "{{ this.entity_id }}"
          entities: >
            {% set ns = namespace(entities=[]) %}
            {% for entity in states.sensor
              | selectattr('attributes.battery_monitor', 'defined')
              | selectattr('attributes.device_class', 'eq', 'battery')
              | rejectattr('state', 'in', ['unknown', 'unavailable', 'none']) %}
                {% set battery_level = states(entity.entity_id) | int(100) %}
                {% if battery_level <= 20 %}
                  {% set ns.entities = ns.entities + [entity.entity_id] %}
                {% endif %}
            {% endfor %}
            {{ ns.entities }}
          title: 🪫 Device battery low
          message: >
            {% set entities = this.attributes.get('entities', []) %}
            {% set entity_count = entities | count %}
            {% set entity_first = entities | first %}
            {% if entity_count == 0 %}All sensors powered
            {% elif entity_count == 1 %}{{ entity_first }} is {{ states(entity_first, rounded=True, with_unit=True) }}
            {% else %}{{ entity_first }} ({{ states(entity_first, rounded=True, with_unit=True) }}) and {{ entity_count - 1 }} others have low battery
            {% endif %}

#
# Alerts
#
alert:
  p2_device_battery:
    name: Device Battery Warning
    entity_id: binary_sensor.p2_device_battery_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    notifiers: p2_warning
    repeat:
      - 60
      - 120
    title: "{{ state_attr('binary_sensor.p2_device_battery_trigger', 'title') }}"
    message: "{{ state_attr('binary_sensor.p2_device_battery_trigger', 'message') }}"
    done_message: >
      Recovered at {{ as_local(states.binary_sensor.p2_device_status_trigger.last_changed).strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_device_battery
      subtitle: Lavender Circle
      group: ha
      url: "/1-system/alerts"
      actions:
        - action: alert.p2_device_health.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"
