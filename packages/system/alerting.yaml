# Alerting
# System
#
# Core alerting and notification functionality.
---

#
# Device Configuration
#
homeassistant:
  customize:
    package.node_anchors:
      pkg: &package
        package: system/alerting

    automation.alert_action_handler:
      <<: *package

    automation.alert_daily_unmute:
      <<: *package

    notify.email_todd:
      <<: *package

    notify.p1_critical:
      <<: *package

    notify.p2_warning:
      <<: *package

    sensor.alert_p1_active_count:
      <<: *package

    sensor.alert_p2_active_count:
      <<: *package

#
# Notification Levels
#
notify:

  - name: "email_todd"
    platform: rest
    resource: https://api.smtp2go.com/v3/email/send
    method: "POST_JSON"
    headers: {
      X-Smtp2go-Api-Key: !secret smtp2go_api_key,
      Content-Type: "application/json",
      accept: "application/json"
    }
    message_param_name: "text_body"
    title_param_name: "subject"
    data: {
      sender: !secret smtp2go_from_email,
      to: [
        !secret todds_email
      ]
    }

  - name: p1_critical
    platform: group
    services:
      - service: mobile_app_todds_iphone
      - service: email_todd

  - name: p2_warning
    platform: group
    services:
      - service: mobile_app_todds_iphone
      - service: email_todd

#
# Alert Status Sensors
#
template:
  - sensor:

      - name: alert_p1_active_count
        icon: mdi:alert-box-outline
        state: >
          {{ states.alert
            | selectattr('object_id', 'match', '^p1_*')
            | selectattr('state', 'ne', 'idle')
            | list | length }}

      - name: alert_p2_active_count
        icon: mdi:alert-outline
        state: >
          {{ states.alert
            | selectattr('object_id', 'match', '^p2_*')
            | selectattr('state', 'ne', 'idle')
            | list | length }}

#
# Automations
#
automation:

  # Mobile Notification Action Handler
  # Processes notification actions back to HA Actions in the format:
  # alert.<entity>.<action>
  - id: alert_action_handler
    alias: Notification Action Handler
    description: >
      Handle notification action events and execute the correct system action.
    mode: parallel
    max: 10
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.action.startswith('alert.') }}
    actions:
      - variables:
          action_parts: "{{ trigger.event.data.action.split('.') }}"
          action_entity_id: "{{ action_parts[0] + '.' + action_parts[1] }}"
          action_command: "{{ action_parts[2] }}"
      - choose:
          # Mute alert
          - conditions:
              - condition: template
                value_template: "{{ action_command == 'mute' }}"
            sequence:
              - action: alert.turn_off
                target:
                  entity_id: "{{ action_entity_id }}"
          # Unmute alert
          - conditions:
              - condition: template
                value_template: "{{ action_command == 'unmute' }}"
            sequence:
              - action: alert.turn_on
                target:
                  entity_id: "{{ action_entity_id }}"

  # Daily Re-enable Muted Alerts
  # Runs at 9am to turn on any alerts that are off
  - id: alert_daily_unmute
    alias: Daily Re-enable Muted Alerts
    description: >
      Re-enables any muted alerts daily at 9am to prevent forgetting about them.
    triggers:
      - trigger: time
        at: "09:00:00"
    actions:
      - action: alert.turn_on
        target:
          entity_id: >
            {{ states.alert
              | selectattr('state', 'eq', 'off')
              | map(attribute='entity_id')
              | list }}
