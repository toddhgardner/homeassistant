################################################################################
# Alerting
# Core alerting and notification functionality.
#
# Dependencies:
#   - @see https://github.com/redstone99/hass-alert2-ui
################################################################################
---
input_number:
  ##############################################################################
  # Alert Settings
  ##############################################################################
  alert_snooze_duration:
    name: Alert Snooze Duration
    initial: 120
    min: 1
    max: 1440
    step: 1
    unit_of_measurement: minutes
    icon: mdi:timer-pause
    mode: box

notify:
  ##############################################################################
  # Notification Levels
  ##############################################################################
  - name: p1_critical
    platform: group
    services:
      - service: mobile_app_todds_iphone
      #- service: mobile_app_erins_iphone

  - name: p2_warning
    platform: group
    services:
      - service: mobile_app_todds_iphone

  - name: p3_info
    platform: group
    services:
      - service: persistent_notification

automation:
  ##############################################################################
  # Mobile Notification Action Handler
  # Processes notification actions back to HA Actions in the format:
  # alert2.<entity>.<action>
  ##############################################################################
  - id: alert_action_handler
    alias: Notification Action Handler
    description: >
      Handle notification action events and execute the correct system action.
    mode: parallel
    max: 10

    triggers:
      - trigger: event
        event_type: mobile_app_notification_action

    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.action.startswith('alert2.') }}

    actions:
      - variables:
          action_parts: "{{ trigger.event.data.action.split('.') }}"
          action_entity_id: "{{ action_parts[0] + '.' + action_parts[1] }}"
          action_command: "{{ action_parts[2] }}"

      - choose:
          # Acknowledge alert
          - conditions:
              - condition: template
                value_template: "{{ action_command == 'ack' }}"
            sequence:
              - action: alert2.ack
                target:
                  entity_id: "{{ action_entity_id }}"

          # Snooze alert
          - conditions:
              - condition: template
                value_template: "{{ action_command == 'snooze' }}"
            sequence:
              - action: alert2.notification_control
                data:
                  entity_id: "{{ action_entity_id }}"
                  ack_at_snooze_start: false
                  enable: true
                  snooze_until: "{{ (now() + timedelta(minutes=states('input_number.alert_snooze_duration') | int(2))).isoformat() }}"

################################################################################
# Alerting Defaults for mobile actions
# This is wonky for Alert2 v1.15.1. It uses python string interpretation, so we
# can't send regular YAML, we need to send a string. Values can only resolve to
# strings, so we can't use `destructive: true`
################################################################################
alert2:

  defaults:
    data:
      tag: "'{{ alert_entity_id }}'"
      url: "/1-alerting/status"
      actions: |
        [
          {
            "action": "{{ alert_entity_id }}.ack",
            "title": "Acknowledge",
            "icon": "sfsymbols:checkmark.square.fill",
          },
          {
            "action": "{{ alert_entity_id }}.snooze",
            "title": "Snooze",
            "icon": "sfsymbols:bell.slash.fill",
          },
        ]

template:
  ##############################################################################
  # Alert Counts for UI
  ##############################################################################
  - sensor:
      - name: "Alert P1 Active Count"
        icon: mdi:alert-box-outline
        state: >
          {{ states.alert2
            | selectattr('attributes.priority', 'eq', 'high')
            | selectattr('state', 'eq', 'on')
            | list | length }}

      - name: "Alert P2 Active Count"
        icon: mdi:alert-outline
        state: >
          {{ states.alert2
            | selectattr('attributes.priority', 'eq', 'medium')
            | selectattr('state', 'eq', 'on')
            | list | length }}

      - name: "Alert P3 Active Count"
        icon: mdi:information-outline
        state: >
          {{ states.alert2
            | selectattr('attributes.priority', 'eq', 'low')
            | selectattr('state', 'eq', 'on')
            | list | length }}

