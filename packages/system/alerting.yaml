################################################################################
# Alerting
# Core alerting and notification functionality.
################################################################################
---
notify:
  ##############################################################################
  # Notification Levels
  ##############################################################################
  - name: p1_critical
    platform: group
    services:
      - service: mobile_app_todds_iphone

  - name: p2_warning
    platform: group
    services:
      - service: mobile_app_todds_iphone

template:
  ##############################################################################
  # Alert Counts for UI
  ##############################################################################
  - sensor:
      - name: "Alert P1 Active Count"
        icon: mdi:alert-box-outline
        state: >
          {{ states.alert
            | selectattr('object_id', 'match', '^p1_*')
            | selectattr('state', 'ne', 'idle')
            | list | length }}

      - name: "Alert P2 Active Count"
        icon: mdi:alert-outline
        state: >
          {{ states.alert
            | selectattr('object_id', 'match', '^p2_*')
            | selectattr('state', 'ne', 'idle')
            | list | length }}

input_number:
  ##############################################################################
  # Alert Settings
  ##############################################################################
  alert_snooze_duration:
    name: Alert Snooze Duration
    initial: 120
    min: 1
    max: 1440
    step: 1
    unit_of_measurement: minutes
    icon: mdi:timer-pause
    mode: box

automation:
  ##############################################################################
  # Mobile Notification Action Handler
  # Processes notification actions back to HA Actions in the format:
  # alert.<entity>.<action>
  ##############################################################################
  - id: alert_action_handler
    alias: Notification Action Handler
    description: >
      Handle notification action events and execute the correct system action.
    mode: parallel
    max: 10

    triggers:
      - trigger: event
        event_type: mobile_app_notification_action

    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.action.startswith('alert.') }}

    actions:
      - variables:
          action_parts: "{{ trigger.event.data.action.split('.') }}"
          action_entity_id: "{{ action_parts[0] + '.' + action_parts[1] }}"
          action_command: "{{ action_parts[2] }}"

      - choose:
          # Mute alert
          - conditions:
              - condition: template
                value_template: "{{ action_command == 'mute' }}"
            sequence:
              - action: alert.turn_off
                target:
                  entity_id: "{{ action_entity_id }}"

          # Unmute alert
          - conditions:
              - condition: template
                value_template: "{{ action_command == 'unmute' }}"
            sequence:
              - action: alert.turn_on
                target:
                  entity_id: "{{ action_entity_id }}"
