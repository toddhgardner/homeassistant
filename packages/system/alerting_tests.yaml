################################################################################
# Alerting Tests
# Test alerts for validating the alerting system at each severity level.
################################################################################
---
input_boolean:
  ##############################################################################
  # Test Alert Switches
  ##############################################################################
  p1_test_alert:
    name: "P1 Test Alert"
    icon: mdi:alert-box-outline

  p2_test_alert:
    name: "P2 Test Alert"
    icon: mdi:alert-outline

template:
  ##############################################################################
  # Test Alert Triggers
  # For testing, this is really simple. Just look if the switch got flipped on.
  ##############################################################################
  - binary_sensor:
      - name: p1_test_alert_trigger
        state: >
          {{ is_state('input_boolean.p1_test_alert', 'on') }}
        availability: on

  - binary_sensor:
      - name: p2_test_alert_trigger
        state: >
          {{ is_state('input_boolean.p2_test_alert', 'on') }}
        availability: on

alert:
  ##############################################################################
  # Test Alerts
  ##############################################################################
  p1_test_alert:
    name: P1 Test Alert
    entity_id: binary_sensor.p1_test_alert_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    repeat: 1
    title: "title"
    message: "message"
    done_message: "done"
    notifiers:
      - p1_critical

  p2_test_alert:
    name: P2 Test Alert
    entity_id: binary_sensor.p2_test_alert_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    repeat: 1
    title: "title"
    message: "message"
    done_message: "done"
    notifiers:
      - p2_warning
