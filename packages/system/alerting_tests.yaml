################################################################################
# Alerting Tests
# Test alerts for validating the alerting system at each severity level.
################################################################################
---
input_boolean:
  ##############################################################################
  # Test Alert Switches
  ##############################################################################
  p1_test_alert:
    name: "P1 Test Alert"
    icon: mdi:alert-box-outline

  p2_test_alert:
    name: "P2 Test Alert"
    icon: mdi:alert-outline

template:
  ##############################################################################
  # Test Alert Triggers
  # For testing, this is really simple. Just look if the switch got flipped on.
  ##############################################################################
  - binary_sensor:
      - name: p1_test_alert_trigger
        state: >
          {{ is_state('input_boolean.p1_test_alert', 'on') }}
        availability: on
        attributes:
          source_entity_id: "input_boolean.p1_test_alert"

  - binary_sensor:
      - name: p2_test_alert_trigger
        state: >
          {{ is_state('input_boolean.p2_test_alert', 'on') }}
        availability: on
        attributes:
          source_entity_id: "input_boolean.p2_test_alert"

alert:
  ##############################################################################
  # Test Alerts
  ##############################################################################
  p1_test_alert:
    name: P1 Test Alert
    entity_id: binary_sensor.p1_test_alert_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    repeat: 1 # for testing
    notifiers: p1_critical
    title: 🚨 P1 Test Alert
    message: >
      ACTIVE: "on" for {{ relative_time(states.binary_sensor.p1_test_alert_trigger.last_changed) }}
    done_message: >
      DONE: "off" on {{ states.binary_sensor.p1_test_alert_trigger.last_changed.strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p1_test_alert
      subtitle: Lavender Circle
      group: ha
      url: "/1-alerting/status"
      push:
        interruption-level: critical
      actions:
        - action: alert.p1_test_alert.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"

  p2_test_alert:
    name: P2 Test Alert
    entity_id: binary_sensor.p2_test_alert_trigger
    state: "on"
    can_acknowledge: true
    skip_first: false
    repeat: 1 # for testing
    notifiers: p2_warning
    title: ⚠️ P2 Test Alert
    message: >
      ACTIVE: "on" for {{ relative_time(states.binary_sensor.p2_test_alert_trigger.last_changed) }}
    done_message: >
      DONE: "off" on {{ states.binary_sensor.p2_test_alert_trigger.last_changed.strftime('%a %b %-d, %-I:%M %p') }}
    data:
      tag: p2_test_alert
      subtitle: Lavender Circle
      group: ha
      url: "/1-alerting/status"
      actions:
        - action: alert.p2_test_alert.mute
          title: "Mute"
          icon: "sfsymbols:bell.slash"