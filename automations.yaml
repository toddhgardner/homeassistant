- id: ups_emergency_shutdown
  alias: UPS Emergency Shutdown
  description: Shut down the NAS and HA host when the rack UPS is on battery and drops
    below 20%. Notification and logging must never block the shutdown chain.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.rack_ups_battery_charge
    below: 20
  conditions:
  - condition: state
    entity_id: binary_sensor.rack_ups_status
    state: 'off'
  actions:
  - action: notify.p1_alert
    data:
      title: "\U0001FAAB UPS battery critical - shutting down"
      message: Battery at {{ states('sensor.rack_ups_battery_charge', rounded=True,
        with_unit=True) }} - Initiating emergency shutdown
      data:
        tag: p1_ups_critical
        subtitle: Lavender Circle
        group: ha
        push:
          interruption-level: critical
        url: /dashboard-lavender/alerts
    continue_on_error: true
  - action: logbook.log
    metadata: {}
    data:
      name: System
      message: ups battery critical - shutting down nas and ha host
      entity_id: input_boolean.log_event
    continue_on_error: true
  - action: synology_dsm.shutdown
    continue_on_error: true
  - delay:
      seconds: 10
  - action: hassio.host_shutdown
  mode: single
