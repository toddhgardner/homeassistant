      > 28800 }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - time
      sequence:
      - variables:
          message: Your curfew is in 30 minutes. Time to head home.
          title: Curfew Warning
    - conditions:
      - condition: trigger
        id:
        - battery
      sequence:
      - variables:
          message: Your battery is low. Check in with your parents on your plans.
          title: Battery Warning
  - action: notify.izzy_gardner
    metadata: {}
    data:
      message: '{{ message }}'
      title: '{{ title }}'
      data:
        tag: curfew
        push:
          interruption-level: critical
  - action: notify.parents
    metadata: {}
    data:
      message: Isabelle is away with {{ states('sensor.izzys_iphone_battery_level',
        with_unit=True) }} battery
      title: Isabelle Curfew Warning
      data:
        tag: isabelle_curfew
  mode: single
- id: '1765643563654'
