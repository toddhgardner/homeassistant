- id: '1764726731546'
  alias: Exterior Lights Controller
  description: 'On during nighttime active hours. Stays on indefinitely when someone
    is nearby but not home. Skips entirely when household is out of town.

    '
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.night_time
    to:
    - 'on'
    id: night-on
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: state
    entity_id: binary_sensor.night_time
    to: 'off'
    id: night-off
  - trigger: state
    entity_id: schedule.active_hours
    to: 'on'
    id: active-on
  - trigger: state
    entity_id: schedule.active_hours
    to: 'off'
    id: active-off
  - trigger: template
    value_template: "{% set ns = namespace(nearby_away=false) %} {% for person in
      expand('group.household') %}\n  {% if person.state != 'home'\n     and distance('zone.home',
      person.entity_id) | float(999) < 80 %}\n    {% set ns.nearby_away = true %}\n
      \ {% endif %}\n{% endfor %} {{ not ns.nearby_away }}\n"
    for: 00:05:00
    id: person-arrived
    alias: Household in town and home
  conditions:
  - condition: state
    entity_id: binary_sensor.household_in_town
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - night-on
        - active-on
      - condition: state
        entity_id: binary_sensor.night_time
        state: 'on'
      - condition: state
        entity_id: schedule.active_hours
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.front_yard_lights
    - conditions:
      - condition: trigger
        id:
        - active-off
        - person-arrived
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.night_time
          state: 'off'
        - condition: state
          entity_id: schedule.active_hours
          state: 'off'
      - condition: template
        value_template: "{% set ns = namespace(nearby_away=false) %} {% for person
          in expand('group.household') %}\n  {% if person.state != 'home'\n     and
          distance('zone.home', person.entity_id) | float(999) < 50 %}\n    {% set
          ns.nearby_away = true %}\n  {% endif %}\n{% endfor %} {{ not ns.nearby_away
          }}\n"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.front_yard_lights
    - conditions:
      - condition: trigger
        id:
        - night-off
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.front_yard_lights
  mode: restart
