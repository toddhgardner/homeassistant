    value_template: '{% set last_updated = states[state_attr(''person.erin'', ''device_trackers'')[0]].last_updated
      %}

      {{ (now() - last_updated).total_seconds() >= 86400 }}

      '
    id: erin
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - todd
      sequence:
      - action: notify.todd_gardner
        metadata: {}
        data:
          message: request_location_update
        alias: Send Todd's iPhone request_location_update
    - conditions:
      - condition: trigger
        id:
        - sam
      sequence:
      - action: notify.sam_gardner
        metadata: {}
        data:
          message: request_location_update
        alias: Send Sams's iPhone request_location_update
    - conditions:
      - condition: trigger
        id:
        - izzy
      sequence:
      - action: notify.izzy_gardner
        metadata: {}
        data:
          message: request_location_update
        alias: Send Izzy's iPhone request_location_update
    - conditions:
