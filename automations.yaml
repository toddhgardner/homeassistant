- id: '1727619363042'
  alias: Shade Controller
  description: Control the raising and lowering of window shades in the house.
  triggers:
  - trigger: state
    entity_id: binary_sensor.night_time
    to: 'off'
    id: morning
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 40
    id: midmorning
  - trigger: state
    entity_id: binary_sensor.night_time
    to: 'on'
    for:
      minutes: 5
    id: darken
  conditions:
  - condition: state
    entity_id: binary_sensor.household_in_town
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: morning
      sequence:
      - action: cover.open_cover
        metadata: {}
        target:
          entity_id:
          - cover.dining_room_shade
          - cover.front_office_shade
          - cover.lounge_shade
        data: {}
      - action: cover.set_cover_position
        metadata: {}
        target:
          entity_id:
          - cover.living_room_shade
          - cover.kitchen_shades
        data:
          position: 40
      - action: button.press
        metadata: {}
        target:
          entity_id: button.back_office_shade_preset
        data: {}
    - conditions:
      - condition: trigger
        id: midmorning
      sequence:
      - action: cover.open_cover
        metadata: {}
        data: {}
        target:
          entity_id: cover.window_shades
    - conditions:
      - condition: trigger
        id: darken
      sequence:
      - action: cover.close_cover
        metadata: {}
        target:
          entity_id: cover.window_shades
        data: {}
  mode: single
