- id: '1766516688126'
  alias: Low Battery Check
  description: Check Production devices daily at 6am for batteries and add any that
    have less than 20% remaining to the maintenance list. Completes open battery items
    once the battery recovers above 40%. Skips entirely when household is out of town.
    Runs before the 8am maintenance email so new items make that day's digest.
  triggers:
  - trigger: time
    at: 06:00:00
  conditions:
  - condition: state
    entity_id: binary_sensor.household_in_town
    state: 'on'
    alias: Household in town
  actions:
  - action: todo.get_items
    target:
      entity_id: todo.maintenance
    data:
      status: needs_action
    response_variable: uncompleted_maintenance_items
  - variables:
      existing_texts: '{{ uncompleted_maintenance_items[''todo.maintenance''][''items'']
        | map(attribute=''summary'') | list }}'
      low_batteries: "{% set ns = namespace(devices=[]) %}\n{% for device_id in label_devices(battery_label)
        | reject('in', label_devices(exempt_label)) | list %}\n  {% set device_battery
        = states.sensor\n    | selectattr('entity_id', 'in', device_entities(device_id))\n
        \   | rejectattr('state', 'in', ['unknown', 'unavailable', 'none'])\n    |
        selectattr('attributes.device_class', 'eq', 'battery')\n    | list | first
        | default(false) %}\n  {% if device_battery %}\n    {% set battery_level =
        device_battery.state | float(-1) %}\n    {% if battery_level <= battery_limit
        %}\n      {% set device_name = device_name(device_id) %}\n      {% set item_text
        = 'Change battery in ' ~ device_name %}\n      {% set ns.devices = ns.devices
        + [{\n        'device_id': device_id,\n        'device_name': device_name,\n
        \       'entity_id': device_battery.entity_id,\n        'battery_level': battery_level,\n
        \       'text': item_text,\n        'is_active': item_text in existing_texts\n
        \     }] %}\n    {% endif %}\n  {% endif %}\n{% endfor %}\n{{ ns.devices }}\n"
      resolved_batteries: "{% set ns = namespace(items=[]) %}\n{% for device_id in
        label_devices(battery_label) | reject('in', label_devices(exempt_label)) |
        list %}\n  {% set device_battery = states.sensor\n    | selectattr('entity_id',
        'in', device_entities(device_id))\n    | rejectattr('state', 'in', ['unknown',
        'unavailable', 'none'])\n    | selectattr('attributes.device_class', 'eq',
        'battery')\n    | list | first | default(false) %}\n  {% if device_battery
        %}\n    {% set battery_level = device_battery.state | float(-1) %}\n    {%
        set item_text = 'Change battery in ' ~ device_name(device_id) %}\n    {% if
        battery_level >= clear_limit and item_text in existing_texts %}\n      {%
        set ns.items = ns.items + [{'text': item_text, 'battery_level': battery_level}]
        %}\n    {% endif %}\n  {% endif %}\n{% endfor %}\n{{ ns.items }}\n"
  - repeat:
      for_each: '{{ resolved_batteries }}'
      sequence:
      - action: todo.update_item
        target:
          entity_id: todo.maintenance
        data:
          item: '{{ repeat.item.text }}'
          status: completed
        note: Battery recovered above clear_limit, close out the todo item.
  - repeat:
      for_each: '{{ low_batteries | selectattr(''is_active'', ''eq'', false) | list
        }}'
      sequence:
      - action: todo.add_item
        target:
          entity_id: todo.maintenance
        data:
          item: '{{ repeat.item.text }}'
          description: Battery at {{ repeat.item.battery_level }}% ({{ repeat.item.entity_id
            }})
          due_date: '{{ (now() + timedelta(days=7)).strftime(''%Y-%m-%d'') }}'
  - if:
    - condition: template
      value_template: '{{ low_batteries | length > 0 }}'
      alias: If any low batteries found
    then:
    - action: notify.maintenance_notice
      data:
        title: "\U0001FAAB {{ low_batteries | length }} devices have low battery"
        message: 'The following Production devices have low batteries:

          {% for item in low_batteries %} • {{ item.device_name }}: {{ item.battery_level
          }}%

          {% endfor %}'
  variables:
    battery_label: Production
    exempt_label: Battery Exempt
    battery_limit: 20
    clear_limit: 40
  mode: single
