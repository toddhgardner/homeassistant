- id: '1780260597562'
  alias: Switch HVAC Heat and Cool
  description: 'At 8am: switches all thermostats between heat and cool based on indoor
    average temp and today''s forecast high. Only acts when all three are already
    in the same mode.

    '
  triggers:
  - trigger: time
    at: 08:00:00
    id: check_heat
  conditions: []
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: forecast
  - choose:
    - conditions:
      - alias: Indoor avg below 67°F
        condition: numeric_state
        entity_id: sensor.average_current_temperature
        below: 67
      - alias: Forecast high below 65°F
        condition: template
        value_template: '{{ forecast[''weather.forecast_home''][''forecast''][0][''temperature'']
          | float(999) < 65 }}

          '
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id:
          - climate.basement_thermostat
          - climate.main_floor_thermostat
          - climate.upstairs_thermostat
        data:
          hvac_mode: heat
      - action: logbook.log
        data:
          name: System
          message: 'switched all thermostats to heat — indoor avg {{ states(''sensor.average_indoor_temperature'')
            }}°F, forecast high {{ forecast[''weather.forecast_home''][''forecast''][0][''temperature'']
            }}°F

            '
          entity_id: input_boolean.log_event
    - conditions:
      - alias: Indoor avg above 72°F
        condition: numeric_state
        entity_id: sensor.average_current_temperature
        above: 72
      - alias: Forecast high above 70°F
        condition: template
        value_template: '{{ forecast[''weather.forecast_home''][''forecast''][0][''temperature'']
          | float(0) > 70 }}

          '
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id:
          - climate.basement_thermostat
          - climate.main_floor_thermostat
          - climate.upstairs_thermostat
        data:
          hvac_mode: cool
      - action: logbook.log
        data:
          name: System
          message: 'switched all thermostats to cool — indoor avg {{ states(''sensor.average_indoor_temperature'')
            }}°F, forecast high {{ forecast[''weather.forecast_home''][''forecast''][0][''temperature'']
            }}°F

            '
          entity_id: input_boolean.log_event
