      - action: script.north_shades
        data:
          action: partial
    - conditions:
      - condition: trigger
        id: north_out
      - condition: state
        entity_id: binary_sensor.night_time
        state: 'off'
      sequence:
      - action: script.north_shades
        data:
          action: open
    - conditions:
      - condition: trigger
        id: east_in
      sequence:
      - action: script.east_shades
        data:
          action: partial
    - conditions:
      - condition: trigger
        id: east_out
      - condition: state
        entity_id: binary_sensor.night_time
        state: 'off'
      sequence:
      - action: script.east_shades
        data:
          action: open
    - conditions:
      - condition: trigger
        id: south_in
      sequence:
      - action: script.south_shades
        data:
          action: partial
    - conditions:
      - condition: trigger
        id: south_out
      - condition: state
        entity_id: binary_sensor.night_time
        state: 'off'
      sequence:
      - action: script.south_shades
        data:
          action: open
    - conditions:
      - condition: trigger
        id: west_in
      sequence:
      - action: script.west_shades
        data:
          action: partial
    - conditions:
      - condition: trigger
        id: west_out
      - condition: state
        entity_id: binary_sensor.night_time
        state: 'off'
      sequence:
      - action: script.west_shades
        data:
          action: open
    - conditions:
      - condition: trigger
        id: darken
      sequence:
      - repeat:
          count: 3
          sequence:
          - action: cover.close_cover
