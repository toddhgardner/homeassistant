    to: 'on'
    id: morning_bedroom
  - trigger: state
    alias: North Sun In
    entity_id: binary_sensor.north_direct_sun
    to: 'on'
    id: north_in
  - trigger: state
    alias: North Sun Out
    entity_id: binary_sensor.north_direct_sun
    to: 'off'
    id: north_out
  - trigger: state
    alias: East Sun In
    entity_id: binary_sensor.east_direct_sun
    to: 'on'
    id: east_in
  - trigger: state
    alias: East Sun Out
    entity_id: binary_sensor.east_direct_sun
    to: 'off'
    id: east_out
  - trigger: state
    alias: South Sun In
    entity_id: binary_sensor.south_direct_sun
    to: 'on'
    id: south_in
  - trigger: state
    alias: South Sun Out
    entity_id: binary_sensor.south_direct_sun
    to: 'off'
    id: south_out
  - trigger: state
    alias: West Sun In
    entity_id: binary_sensor.west_direct_sun
    to: 'on'
    id: west_in
  - trigger: state
    alias: West Sun Out
    entity_id: binary_sensor.west_direct_sun
    to: 'off'
    id: west_out
  - alias: Darken
    trigger: state
    entity_id:
    - binary_sensor.night_time
    to:
    - 'on'
