- id: ups_emergency_shutdown
  alias: UPS Emergency Shutdown
  description: Shutdown HA and NAS when UPS battery drops below 20%
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.cyberpower_network_ups_battery_charge
    below: 20
  conditions:
  - condition: template
    value_template: '{{ ''On Battery'' in states(''sensor.cyberpower_network_ups_status'')
      }}

      '
  actions:
  - action: notify.p1_critical
    data:
      title: "\U0001FAAB UPS battery critical - shutting down"
      message: Battery at {{ states('sensor.cyberpower_network_ups_battery_charge',
        rounded=True, with_unit=True) }} - Initiating emergency shutdown
      data:
        tag: p1_ups_critical
        subtitle: Lavender Circle
        group: ha
        push:
          interruption-level: critical
        url: /1-system/alerts
  - action: synology_dsm.shutdown
  - delay:
      seconds: 10
  - action: hassio.host_shutdown
  mode: single
- id: back_patio_auto_heat_mats_off
  alias: Back Patio Auto Heat Mats Off
  description: Turn off heat mats automatically
  triggers:
  - trigger: state
    entity_id: switch.back_patio_heat_mats
    to: 'on'
    for:
      minutes: 90
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.back_patio_heat_mats
  mode: single
