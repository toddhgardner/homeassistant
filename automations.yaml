- id: '1766516688126'
  alias: Low Battery Check
  description: Check Production devices daily for batteries and add any that have
    less than 20% remaining to the maintenance list.
  triggers:
  - trigger: time
    at: 07:00:00
  conditions: []
  actions:
  - action: todo.get_items
    metadata: {}
    target:
      entity_id: todo.maintenance
    data:
      status: needs_action
    response_variable: uncompleted_maintenance_items
  - variables:
      low_batteries: "{% set label = 'Production' %}  {% set battery_limit = 20.0
        %}  {% set exclude_devices = [\n  '29b1ea7766607bc3fc5b456f2efafd41',\n  'a60b69543ac7f2c0a43f17ddd44078e8',\n
        \ '58aadd7003405e4c76e166880c01ee1c',\n  'd1725662ae90ea69a5197b4321da26f4'\n]
        %} {% set existing_texts = uncompleted_maintenance_items['todo.maintenance']['items']
        | map(attribute='summary') | list %} {% set ns = namespace(devices=[]) %}
        {% set devices = label_devices(label) \n  | reject('in', exclude_devices)
        \n  | list %}\n{% for device_id in devices %}\n  {% set device_battery = states.sensor\n
        \   | selectattr('entity_id', 'in', device_entities(device_id))\n    | rejectattr('state',
        'in', ['unknown', 'unavailable', 'none']) \n    | selectattr('attributes.device_class',
        'eq', 'battery')\n    | list | first | default(false) %}\n  {% if (device_battery)
        %}\n    {% set battery_level = device_battery.state | float(-1) %}\n    {%
        if battery_level <= battery_limit | float(-1) %}\n      {% set device_name
        = device_name(device_id) %}\n      {% set item_text = 'Change battery in '
        ~ device_name %}\n      {% set ns.devices = ns.devices + [{\n        'device_id':
        device_id,\n        'device_name': device_name,\n        'entity_id': device_battery.entity_id,\n
        \       'battery_level': battery_level,\n        'text': item_text,\n        'is_active':
        item_text in existing_texts\n      }] %}\n    {% endif %}\n  {% endif %}\n{%
        endfor %} {{ ns.devices }}\n"
  - repeat:
      for_each: '{{ low_batteries | selectattr(''is_active'', ''eq'', false) | list
        }}'
      sequence:
      - action: todo.add_item
        metadata: {}
        target:
          entity_id: todo.maintenance
        data:
          item: '{{ repeat.item.text }}'
          description: Battery at {{ repeat.item.battery_level }}% ({{ repeat.item.entity_id
            }})
          due_date: '{{ (now() + timedelta(days=7)).strftime(''%Y-%m-%d'') }}'
  - if:
    - condition: template
      value_template: '{{ low_batteries | length > 0 }}'
      alias: If any low batteries found
    then:
    - action: notify.maintenance_notice
      metadata: {}
      data:
        title: "\U0001FAAB {{ low_batteries | length }} devices have low battery"
        message: 'The following Production devices have low batteries:

          {% for item in low_batteries %} • {{ item.device_name }}: {{ item.battery_level
          }}%

          {% endfor %}'
  mode: single
