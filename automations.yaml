  max: 4
- id: '1783784448729'
  alias: Kitchen Light Controller
  description: Scene-based kitchen lighting. On with motion (6am to active hours end)
    or at active hours start. Idle after 60 min without motion. Off when active hours
    ends. Manual off suspends turn-on AND idle until active hours ends; manual on
    re-engages. Entire automation requires household in town; the switches' own 24h
    auto-off failsafe covers lights left on when leaving.
  triggers:
  - trigger: state
    entity_id: binary_sensor.common_motion
    to: 'on'
    id: motion-on
  - trigger: state
    entity_id: schedule.active_hours
    to: 'on'
    id: active-on
  - trigger: state
    entity_id: binary_sensor.common_motion
    to: 'off'
    for:
      minutes: 60
    id: motion-idle
  - trigger: state
    entity_id: schedule.active_hours
    to: 'on'
    for:
      minutes: 60
    id: active-idle-check
  - trigger: state
    entity_id: schedule.active_hours
    to: 'off'
    id: active-off
  - trigger: state
    entity_id:
    - switch.kitchen_kitchen_upper_cabinet_lights
    - switch.kitchen_kitchen_under_cabinet_lights
    - switch.pantry_pantry_overhead_lights
    - light.kitchen_kitchen_pendant_lights
    to: 'off'
    id: manual-off
  - trigger: state
    entity_id:
    - switch.kitchen_kitchen_upper_cabinet_lights
    - switch.kitchen_kitchen_under_cabinet_lights
    - switch.pantry_pantry_overhead_lights
    - light.kitchen_kitchen_pendant_lights
    to: 'on'
    id: manual-on
  conditions:
  - condition: state
    entity_id: binary_sensor.household_in_town
    state: 'on'
  actions:
  - choose:
    - alias: 'ON: motion in allowed window'
      conditions:
      - condition: trigger
        id:
        - motion-on
      - condition: state
        entity_id: input_boolean.kitchen_lights_manual_override
        state: 'off'
      - condition: or
        conditions:
        - condition: state
          entity_id: schedule.active_hours
          state: 'on'
        - condition: time
          after: 06:00:00
          before: 08:00:00
      - alias: 'Gate: skip if everything is already on'
        condition: or
        conditions:
        - condition: state
          entity_id: light.kitchen_kitchen_upper_cabinet_lights
          state: 'off'
        - condition: state
          entity_id: light.kitchen_kitchen_under_cabinet_lights
          state: 'off'
        - condition: state
          entity_id: light.pantry_pantry_overhead_lights
          state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.kitchen_lights_on
    - alias: 'ON: active hours start'
      conditions:
      - condition: trigger
        id:
        - active-on
      - condition: state
        entity_id: input_boolean.kitchen_lights_manual_override
        state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.kitchen_lights_on
    - alias: 'IDLE: no motion for 60 min during active hours'
      conditions:
      - condition: trigger
        id:
        - motion-idle
      - condition: state
        entity_id: schedule.active_hours
        state: 'on'
      - condition: state
        entity_id: input_boolean.kitchen_lights_manual_override
        state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.kitchen_lights_idle
    - alias: 'IDLE: active hours started 60 min ago, still nobody'
      conditions:
      - condition: trigger
        id:
        - active-idle-check
      - condition: state
        entity_id: binary_sensor.common_motion
        state: 'off'
        for:
          minutes: 60
      - condition: state
        entity_id: input_boolean.kitchen_lights_manual_override
        state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.kitchen_lights_idle
    - alias: 'OFF: active hours end'
      conditions:
      - condition: trigger
        id:
        - active-off
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.kitchen_lights_off
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_lights_manual_override
    - alias: 'MANUAL OFF: suspend turn-on for the rest of the day'
      conditions:
      - condition: trigger
        id:
        - manual-off
      - condition: template
        value_template: '{{ trigger.to_state.context.parent_id is none }}'
      - condition: state
        entity_id: input_boolean.kitchen_lights_manual_override
        state: 'off'
      - condition: or
        conditions:
        - condition: state
          entity_id: schedule.active_hours
          state: 'on'
        - condition: time
          after: 06:00:00
          before: 08:00:00
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.kitchen_lights_manual_override
    - alias: 'MANUAL ON: re-engage the automation'
      conditions:
      - condition: trigger
        id:
        - manual-on
      - condition: template
        value_template: '{{ trigger.to_state.context.parent_id is none }}'
      - condition: state
        entity_id: input_boolean.kitchen_lights_manual_override
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_lights_manual_override
  mode: queued
  max: 5
- id: '1784386568218'
  alias: Z-Wave Heartbeat
  description: 'Hourly ping of mains-powered z-wave devices with the Production label.
    Z-wave has no passive offline detection: a node is only marked dead when a command
    to it fails, so an untouched device can stay "alive" indefinitely. Failed pings
    mark the node dead within the hour, which trips the device offline alert. Successful
    pings revive recovered nodes. Sleeping (battery) nodes are excluded — pings would
    queue until wake and drain the battery for no signal.'
  triggers:
  - trigger: time_pattern
    minutes: '7'
  conditions: []
  actions:
  - variables:
      ping_buttons: "{% set ns = namespace(buttons=[]) %} {% for d in label_devices('Production')
        %}\n  {% set ents = device_entities(d) %}\n  {% set node_status = ents\n      |
        select('search', '_node_status$')\n      | list | first | default(none) %}\n
        \ {% set ping = ents\n      | select('search', '^button\\..*_ping$')\n      |
        list | first | default(none) %}\n  {% if node_status and ping and states(node_status)
        != 'asleep' %}\n    {% set ns.buttons = ns.buttons + [ping] %}\n  {% endif
        %}\n{% endfor %} {{ ns.buttons }}"
  - repeat:
      for_each: '{{ ping_buttons }}'
      sequence:
      - action: button.press
        target:
          entity_id: '{{ repeat.item }}'
        continue_on_error: true
  mode: single
