            - condition: state
              entity_id: binary_sensor.east_direct_sun
              state: 'on'
            then:
            - action: script.east_shades
              data:
                action: partial
            else:
            - action: script.east_shades
              data:
                action: open
        - action: script.south_shades
          data:
            action: open
        - action: script.west_shades
          data:
            action: open
    - conditions:
      - condition: trigger
        id: morning_bedroom
      - condition: state
        entity_id: binary_sensor.night_time
        state: 'off'
      sequence:
      - parallel:
        - sequence:
          - if:
            - condition: state
              entity_id: binary_sensor.north_direct_sun
              state: 'on'
            then:
            - action: script.north_shades
