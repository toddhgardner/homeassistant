- id: '1780174294556'
  alias: Primary Bedroom Controller
  description: 'Sets custom brightness based on night_time. Runs bedtime sequence:
    on at 9pm, partial off at 9:30pm, sconces fade to off by 10:15pm.

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.night_time
    to: 'on'
    id: night-on
  - trigger: state
    entity_id: binary_sensor.night_time
    to: 'off'
    id: night-off
  - trigger: time
    at: '21:00:00'
    id: bedtime-on
  - trigger: time
    at: '21:30:00'
    id: bedtime-partial
  - trigger: time
    at: '22:00:00'
    id: bedtime-dim
  conditions:
  - condition: state
    entity_id: binary_sensor.household_in_town
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: night-on
      sequence:
      - action: zwave_js.set_config_parameter
        target:
          entity_id:
          - light.primary_bedroom_main_light_switch
          - light.primary_bedroom_hall_light_switch
          - light.primary_bedroom_sconce_light_switch
        data:
          parameter: 18
          value: 30
      - action: light.turn_on
        target:
          entity_id: "{{ ['light.primary_bedroom_main_light_switch',\n    'light.primary_bedroom_hall_light_switch',\n
            \   'light.primary_bedroom_sconce_light_switch']\n   | select('is_state',
            'on') | list }}\n"
        data:
          brightness_pct: 30
          transition: 2
    - conditions:
      - condition: trigger
        id: night-off
      sequence:
      - action: zwave_js.set_config_parameter
        target:
          entity_id:
          - light.primary_bedroom_main_light_switch
          - light.primary_bedroom_hall_light_switch
          - light.primary_bedroom_sconce_light_switch
        data:
          parameter: 18
          value: 99
      - action: light.turn_on
        target:
          entity_id: "{{ ['light.primary_bedroom_main_light_switch',\n    'light.primary_bedroom_hall_light_switch',\n
            \   'light.primary_bedroom_sconce_light_switch']\n   | select('is_state',
            'on') | list }}\n"
        data:
          brightness_pct: 100
          transition: 2
    - conditions:
      - condition: trigger
        id: bedtime-on
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.primary_bedroom_main_light_switch
          - light.primary_bedroom_hall_light_switch
          - light.primary_bedroom_sconce_light_switch
        data:
          brightness_pct: '{{ 30 if is_state(''binary_sensor.night_time'', ''on'')
            else 100 }}

            '
      - action: cover.close_cover
        metadata: {}
        target:
          entity_id:
          - cover.primary_bathroom_shade
          - cover.primary_bedroom_shades
        data: {}
      - action: media_player.select_source
        metadata: {}
        target:
          entity_id: media_player.primary_bedroom_roku
        data:
          source: Aquatic Life
    - conditions:
      - condition: trigger
        id: bedtime-partial
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.primary_bedroom_main_light_switch
          - light.primary_bedroom_hall_light_switch
    - conditions:
      - condition: trigger
        id: bedtime-dim
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.primary_bedroom_sconce_light_switch
        data:
          transition: 900
  mode: single
