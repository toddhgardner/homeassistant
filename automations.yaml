  - trigger: state
    entity_id:
    - timer.hvac_run_time
    to:
    - idle
    id: expired
  - trigger: tag
    tag_id: 00aa034d-11e9-48e6-9b6b-4ceefd8c09b4
    id: changed-filter
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - running
      sequence:
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.hvac_run_time
        data: {}
    - conditions:
      - condition: trigger
        id:
        - not-running
      sequence:
      - action: timer.pause
        metadata: {}
        target:
          entity_id: timer.hvac_run_time
        data: {}
    - conditions:
      - condition: trigger
        id:
        - expired
      sequence:
      - action: todo.add_item
        metadata: {}
        target:
          entity_id: todo.maintenance
        data:
          item: Change HVAC Filter
          due_date: '{{ (now() + timedelta(days=7)).strftime(''%Y-%m-%d'') }}'
    - conditions:
      - condition: trigger
        id:
        - changed-filter
      sequence:
      - action: timer.cancel
        metadata: {}
        target:
          entity_id: timer.hvac_run_time
        data: {}
      - action: todo.remove_item
        metadata: {}
        target:
          entity_id: todo.maintenance
        data:
          item: Change HVAC Filter
  mode: single
