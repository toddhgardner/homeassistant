lavender:
  # primary-color: red
  # accent-color: blue
  # primary-text-color: blue

  modes:                         # 1.2.1 - change add modes: dark-only declaration
    dark: {}


  # =========================
  # HEADER (Top Bar)
  # =========================
  app-header-backdrop-filter: 'blur(8px) saturate(1.1)'
  app-header-background-color: 'rgba(30, 30, 30, 0.01)'
  app-header-text-color: 'rgba(240, 243, 255, 0.95)'
  app-header-edit-background-color: 'rgba(30, 33, 54, 0.8)'
  app-header-edit-text-color: 'rgba(234, 235, 238, 0.98)'
  app-theme-color: 'rgb(0, 0, 0)'                                                      # 1.2 Glass – header theme color hint for browsers

  # =========================
  # SIDEBAR / DRAWER
  # =========================
  sidebar-background-color: 'rgba(30, 30, 30, 0.8)'
  sidebar-icon-color: 'rgba(234, 235, 238, 0.6)'
  sidebar-text-color: 'rgba(234, 235, 238, 0.8)'
  sidebar-selected-icon-color: 'rgba(234, 235, 238, 0.95)'
  sidebar-selected-text-color: 'rgba(234, 235, 238, 0.98)'

  # =========================
  # DIALOGS
  # =========================
  ha-dialog-surface-backdrop-filter: 'blur(8px)'                  # 1.2 Glass – same blur as cards
  ha-dialog-surface-background: 'rgba(30, 30, 30, 0.7)'
  dialog-box-shadow: '0 12px 20px rgba(0, 0, 0, 0.25)'
  paper-dialog-background-color: 'rgba(30, 30, 30, 0.7)'
  mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.8)'


  ha-font-size-xs: 12px

  ha-badge-border-radius: 0
  ha-badge-size: 48px
  ha-badge-icon-size: 24px
  ha-badge-font-size: 14px


  ha-card-background: rgba(255, 255, 255, 0.1)
  ha-card-backdrop-filter: blur(8px)
  ha-card-border-color: rgba(255, 255, 255, 0.125)
  ha-card-border-radius: 0
  ha-card-box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1)

  card-mod-theme: lavender
  card-mod-view-yaml: |
    .: |
      {% set is_p1 = states('sensor.p1_alert_count') | float(0) > 0 %}
      {% set is_p2 = states('sensor.p2_alert_count') | float(0) > 0 %}
      :host {
        {% if (is_p1) %}
        --lavender-alert-color: var(--error-color);
        --lavender-alert-text: "CRITICAL";
        {% elif (is_p2) %}
        --lavender-alert-color: var(--warning-color);
        --lavender-alert-text: "WARNING";
        {% endif %}
      }
      @keyframes pulse {
        0% {
          box-shadow: inset 0 0 8px 8px var(--lavender-alert-color);
        }
        50% {
          box-shadow: inset 0 0 32px 32px var(--lavender-alert-color);
        }
        100% {
          box-shadow: inset 0 0 8px 8px var(--lavender-alert-color);
        }
      }
      {% if (is_p1 or is_p2) %}
      hui-view {
        position: relative;
        box-shadow: inset 0 0 32px 32px var(--lavender-alert-color);
        animation: pulse 2s ease-in-out infinite;
        ::before {
          content: var(--lavender-alert-text);
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 32px;
          background-color: var(--lavender-alert-color);
          color: white;
          font-size: 24px;
          line-height: 32px;
          font-weight: 700;
          margin-inline: auto;
          width: fit-content;
          padding: 0px 32px;
          box-shadow: 0 0 8px 8px var(--lavender-alert-color);
        }
      }
      {% endif %}

    hui-sections-view$:
      hui-view-header$: |
        hui-view-badges {
          margin-bottom: 8px;
        }
