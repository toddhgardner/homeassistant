force_garage_doors_closed:
  alias: Force Garage Doors Closed
  use_blueprint:
    path: homeassistant/confirmable_notification.yaml
    input:
      notify_device: 29b1ea7766607bc3fc5b456f2efafd41
      title: Garage door open
      confirm_action:
      - action: lock.unlock
        metadata: {}
        data: {}
        target:
          device_id:
          - 467926e27ed161ffcc4dbb4dd31a6658
          - ab2c394ab61615979a081bf928782ec3
      - action: cover.close_cover
        metadata: {}
        data: {}
        target:
          entity_id: cover.garage_doors
      message: Garage doors have been open for a long time. Hold to force close.
      confirm_text: Force close
  description: ''
  icon: mdi:garage-alert-variant
update_person_location:
  alias: Update location
  fields:
    device_id:
      description: The device to update
      required: true
      selector:
        device:
          filter:
            integration: mobile_app
  sequence:
  - action: notify.mobile_app_{{ device_name(device_id) | slugify }}
    data:
      message: request_location_update
set_cover_to_favorite:
  sequence:
  - repeat:
      count: 10
      sequence:
      - action: cover.stop_cover
        data: {}
        target:
          entity_id: '{{ cover }}

            '
  fields:
    cover:
      name: Cover
      required: true
      selector:
        entity:
          filter:
            domain: cover
  alias: Set Cover to Favorite
  description: ''
north_shades:
  alias: North Shades
  description: 'Open, partial, or close all north-facing shades. Repeats 3 times with
    a 30 second pause. Includes bedroom shades if the bedroom schedule is active.

    '
  fields:
    action:
      description: 'Position to set: open, partial, or close'
      required: true
      selector:
        select:
          options:
          - open
          - partial
          - close
  sequence:
  - repeat:
      count: 3
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ action == ''open'' }}'
            alias: Open
          sequence:
          - action: cover.open_cover
            continue_on_error: true
            target:
              entity_id:
              - cover.living_room_shade
              - cover.kitchen_north_shade_outbound_bottom
              - cover.back_office_north_shade
          - action: cover.set_cover_position
            continue_on_error: true
            target:
              entity_id: cover.lounge_shade_2
            data:
              position: 100
          - if:
            - condition: state
              entity_id: schedule.bedroom_open_hours
              state: 'on'
            then:
            - action: cover.open_cover
              continue_on_error: true
              target:
                entity_id:
                - cover.primary_bedroom_shades
                - cover.primary_bathroom_shade
                - cover.sams_bedroom_shade
        - conditions:
          - condition: template
            value_template: '{{ action == ''partial'' }}'
            alias: Partial
          sequence:
          - action: cover.set_cover_position
            continue_on_error: true
            target:
              entity_id:
              - cover.living_room_shade
              - cover.kitchen_north_shade_outbound_bottom
              - cover.lounge_shade_2
            data:
              position: 40
          - action: button.press
            continue_on_error: true
            target:
              entity_id: button.back_office_north_shade_preset
          - if:
            - condition: state
              entity_id: schedule.bedroom_open_hours
              state: 'on'
            then:
            - action: button.press
              continue_on_error: true
              target:
                entity_id:
                - button.primary_bedroom_shades_preset
                - button.primary_bathroom_shade_preset
                - button.sams_bedroom_shade_preset
        - conditions:
          - condition: template
            value_template: '{{ action == ''close'' }}'
            alias: Close
          sequence:
          - action: cover.close_cover
            continue_on_error: true
            target:
              entity_id:
              - cover.living_room_shade
              - cover.kitchen_north_shade_outbound_bottom
              - cover.lounge_shade_2
              - cover.back_office_north_shade
          - if:
            - condition: state
              entity_id: schedule.bedroom_open_hours
              state: 'on'
            then:
            - action: cover.close_cover
              continue_on_error: true
              target:
                entity_id:
                - cover.primary_bedroom_shades
                - cover.primary_bathroom_shade
                - cover.sams_bedroom_shade
      - delay:
          seconds: 30
  mode: queued
  max: 3
  icon: mdi:roller-shade
